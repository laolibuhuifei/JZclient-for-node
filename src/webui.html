<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JZClientForNode</title>
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<script>
// 主题必须在样式之前定下来, 否则首屏会先白一下再变黑
(function(){
  try {
    var c = localStorage.getItem('jz_theme');
    var dark = c === 'dark' || (c !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<style>
:root{
  --primary:#0b57d0; --on-primary:#ffffff;
  --primary-container:#d3e3fd; --on-primary-container:#041e49;
  --surface:#fdfcff; --on-surface:#1a1c1e;
  --card:#f4f3fa; --on-card:#1a1c1e;
  --surface-variant:#e1e2ec; --on-surface-variant:#43474e;
  --outline:#74777f; --outline-variant:#d6d8e0;
  --error:#ba1a1a; --success:#1a7f37;
  --radius-xl:28px; --radius-lg:20px; --radius-md:14px;
  --shadow:0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  /* 用户手动选了浅色时不跟系统 */
  :root:not([data-theme="light"]){
    --primary:#a8c7fa; --on-primary:#062e6f;
    --primary-container:#0842a0; --on-primary-container:#d3e3fd;
    --surface:#111318; --on-surface:#e2e2e9;
    --card:#1d2025; --on-card:#e2e2e9;
    --surface-variant:#2b2f36; --on-surface-variant:#c4c6d0;
    --outline:#8e9199; --outline-variant:#3a3d44;
    --error:#ffb4ab; --success:#7bd88f;
    --shadow:0 1px 2px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--surface); color:var(--on-surface);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input{font:inherit}
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px 20px; max-width:1120px; margin:0 auto;
  background:color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter:blur(14px);
}
.brand{display:flex; align-items:center; gap:12px}
.logo{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:var(--primary); color:var(--on-primary); font-weight:700; font-size:16px;
}
.brand h1{margin:0;font-size:18px;letter-spacing:.2px}
.brand p{margin:1px 0 0;font-size:12px;color:var(--on-surface-variant)}
main{max-width:1120px;margin:0 auto;padding:0 20px 48px}
.watch-strip{display:flex;gap:8px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none}
.watch-strip::-webkit-scrollbar{display:none}
.watch-chip{
  flex:none;display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:999px;border:1px solid var(--outline-variant);
  background:var(--surface);white-space:nowrap;font-size:13px;
}
.watch-chip.active{background:var(--primary-container);border-color:transparent;color:var(--on-primary-container)}
.watch-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--outline)}
.watch-chip .dot.on{background:var(--success)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;padding:8px 14px;border-radius:999px;font-size:13px;color:var(--on-surface-variant);
}
.tab.active{background:var(--primary-container);color:var(--on-primary-container);font-weight:600}
.content{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{
  background:var(--card);border-radius:var(--radius-lg);padding:16px;
  box-shadow:var(--shadow);border:1px solid transparent;
}
.card-title{font-size:13px;font-weight:600;color:var(--on-surface-variant);margin-bottom:10px;letter-spacing:.3px}
.hero{padding:20px;border-radius:var(--radius-xl);display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.hero .watch-name{font-size:22px;font-weight:700}
.hero .muted{margin-top:4px}
.battery{font-size:30px;font-weight:700;color:var(--primary);line-height:1}
.battery span{font-size:14px;font-weight:500;color:var(--on-surface-variant);margin-left:2px}
.muted{color:var(--on-surface-variant);font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--outline-variant);font-size:14px}
.row:last-child{border-bottom:none}
.row .value{color:var(--on-surface-variant);font-size:13px;text-align:right;word-break:break-all}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:600;
  background:var(--primary);color:var(--on-primary);
}
.btn:active{opacity:.85}
.btn.tonal{background:var(--primary-container);color:var(--on-primary-container)}
.btn.text{background:transparent;color:var(--primary);padding:0 12px}
.btn.danger{background:var(--error);color:#fff}
.btn.small{min-height:32px;padding:0 12px;font-size:12px}
.icon-btn{
  min-height:40px;padding:0 14px;border-radius:999px;font-size:13px;
  border:1px solid var(--outline-variant);color:var(--on-surface-variant)
}
.switch{position:relative;display:inline-block;width:52px;height:32px;flex:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--surface-variant);border:2px solid var(--outline);transition:.2s}
.switch span:before{content:"";position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:.2s}
.switch input:checked + span{background:var(--primary);border-color:var(--primary)}
.switch input:checked + span:before{left:4px;top:2px;width:24px;height:24px;background:var(--on-primary);transform:translateX(20px)}
/* 主页仪表盘 */
.home-hero{position:relative;overflow:hidden;border:1px solid var(--outline-variant);
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 9%,var(--card)) 0%,var(--card) 58%)}
.home-hero:after{content:"";position:absolute;right:-70px;top:-80px;width:200px;height:200px;border-radius:50%;
  background:color-mix(in srgb,var(--primary) 12%,transparent);pointer-events:none}
.home-hero>*{position:relative;z-index:1}
.hero-main{display:flex;align-items:center;gap:14px;min-width:0}
.hero-text{min-width:0}
.hero-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;
  font-size:11.5px;line-height:1.5;background:var(--surface-variant);color:var(--on-surface-variant);white-space:nowrap}
.dot-inline{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--outline);
  margin-right:6px;vertical-align:1px;flex:none}
.dot-inline.on{background:var(--success)}
/* 系统 CPU 环形表 */
.gauge{position:relative;width:92px;height:92px;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.gauge circle{fill:none;stroke-width:9;stroke-linecap:round}
.gauge .g-bg{stroke:var(--surface-variant)}
.gauge .g-fg{transition:stroke-dashoffset .5s ease,stroke .3s}
.gauge-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.gauge-label b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--on-surface)}
.gauge-label span{font-size:10px;color:var(--on-surface-variant)}
/* 资源磁贴 */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{padding:11px 12px;border-radius:var(--radius-md);background:var(--surface-variant);min-width:0}
.t-label{font-size:11.5px;color:var(--on-surface-variant)}
.t-val{font-size:17px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;word-break:break-all}
.t-sub{font-size:10.5px;color:var(--on-surface-variant);margin-top:5px;word-break:break-all}
.meter{height:5px;border-radius:999px;background:color-mix(in srgb,var(--outline) 40%,transparent);margin-top:8px;overflow:hidden}
.meter>i{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .45s ease,background .2s}
.meter.warm>i{background:#e8a33d}
.meter.hot>i{background:var(--error)}
/* 运行环境: 键值网格 */
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px 16px}
.def{min-width:0}
.d-label{font-size:11px;color:var(--on-surface-variant)}
.d-val{font-size:13px;margin-top:2px;word-break:break-all;color:var(--on-surface)}
/* 手表电量小标签 */
.battery-mini{flex:none;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--surface-variant);color:var(--on-surface-variant);font-variant-numeric:tabular-nums}
.battery-mini.low{background:color-mix(in srgb,var(--error) 14%,transparent);color:var(--error)}
/* 每日一言 */
.quote-card{position:relative;margin:14px 0;padding:18px 20px 12px;overflow:hidden;
  background:linear-gradient(120deg,color-mix(in srgb,var(--primary) 7%,var(--card)) 0%,var(--card) 70%)}
.quote-mark{position:absolute;right:16px;top:-10px;font-size:72px;line-height:1;color:color-mix(in srgb,var(--primary) 16%,transparent);
  font-family:Georgia,"Times New Roman",serif;pointer-events:none}
.quote-text{position:relative;z-index:1;font-size:15px;line-height:1.75;color:var(--on-surface);word-break:break-word}
.quote-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;
  font-size:12px;color:var(--on-surface-variant);min-height:32px}
.quote-meta .btn.text{padding:0}
@media (max-width:520px){
  .tiles{grid-template-columns:1fr}
  .gauge{width:78px;height:78px}
  .gauge-label b{font-size:14px}
}
/* ===== 公告 ===== */
.notice-card{margin:0 0 14px;padding:14px 16px}
.notice-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.notice-head .btn.text{padding:0;font-size:12px}
/* 主页公告条目: 整行可点, 用左侧色条代替卡片堆叠 */
.notice-item{
  display:block;width:100%;text-align:left;padding:10px 0 10px 11px;position:relative;
  border-top:1px solid var(--outline-variant);transition:background .15s;
}
.notice-item:first-of-type{border-top:none}
.notice-item:before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;
  background:var(--outline-variant);transition:background .15s;
}
.notice-item:hover{background:var(--surface-variant)}
.notice-item:hover:before{background:var(--primary)}
.notice-title{
  font-size:13.5px;font-weight:600;color:var(--on-surface);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;
}
.notice-pin{
  display:inline-block;margin-right:6px;padding:1px 6px;border-radius:5px;vertical-align:1px;
  font-size:10px;font-weight:600;line-height:1.6;
  background:color-mix(in srgb,var(--primary) 16%,transparent);color:var(--primary);
}
.notice-sub{
  font-size:11.5px;color:var(--on-surface-variant);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* 公告页 */
.notice-page{display:block}
.notice-page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.notice-page-head .muted{font-size:12px;color:var(--on-surface-variant)}
.notice-list{display:flex;flex-direction:column}
.notice-row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:13px 4px;border-bottom:1px solid var(--outline-variant);transition:background .15s;
}
.notice-row:last-child{border-bottom:none}
.notice-row:hover{background:var(--surface-variant)}
.notice-row-main{flex:1;min-width:0}
.notice-arrow{flex:none;font-size:18px;line-height:1;color:var(--on-surface-variant)}
.notice-detail-title{
  margin:2px 0 0;font-size:19px;font-weight:700;line-height:1.45;color:var(--on-surface);word-break:break-word;
}
.notice-detail-meta{
  font-size:12px;color:var(--on-surface-variant);margin-top:6px;padding-bottom:12px;
  border-bottom:1px solid var(--outline-variant);
}
/* Markdown 正文: 只做阅读排版, 不引入任何外部样式 */
.md-body{margin-top:14px;font-size:14px;line-height:1.78;color:var(--on-surface);word-break:break-word}
.md-body>*:first-child{margin-top:0}
.md-body>*:last-child{margin-bottom:0}
.md-body p{margin:0 0 12px}
.md-body h1,.md-body h2,.md-body h3,.md-body h4{margin:22px 0 10px;line-height:1.4;font-weight:700}
.md-body h1{font-size:19px}
.md-body h2{font-size:17px}
.md-body h3{font-size:15px}
.md-body h4{font-size:14px}
.md-body ul,.md-body ol{margin:0 0 12px;padding-left:22px}
.md-body li{margin:4px 0}
.md-body a{color:var(--primary);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--primary) 40%,transparent)}
.md-body a:hover{border-bottom-color:var(--primary)}
.md-body strong{font-weight:700}
.md-body em{font-style:italic}
.md-body del{color:var(--on-surface-variant)}
.md-body hr{border:none;border-top:1px solid var(--outline-variant);margin:18px 0}
.md-body blockquote{
  margin:0 0 12px;padding:2px 0 2px 13px;color:var(--on-surface-variant);
  border-left:3px solid color-mix(in srgb,var(--primary) 45%,transparent);
}
.md-body .md-code{
  padding:1px 5px;border-radius:5px;font-size:12.5px;
  background:var(--surface-variant);color:var(--on-surface);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.md-body .md-pre{
  margin:0 0 14px;padding:12px 14px;border-radius:var(--radius-md);overflow-x:auto;
  background:var(--surface-variant);border:1px solid var(--outline-variant);
}
.md-body .md-pre code{
  font-size:12.5px;line-height:1.6;white-space:pre;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.md-body .md-img{
  display:block;max-width:100%;height:auto;margin:12px 0;border-radius:var(--radius-md);
  border:1px solid var(--outline-variant);cursor:zoom-in;
}
.md-body .md-table{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:13px;display:block;overflow-x:auto}
.md-body .md-table th,.md-body .md-table td{
  padding:7px 10px;border:1px solid var(--outline-variant);text-align:left;white-space:nowrap;
}
.md-body .md-table th{background:var(--surface-variant);font-weight:600}
@media (max-width:520px){
  .notice-card{padding:12px 14px}
  .notice-detail-title{font-size:17px}
  .md-body{font-size:13.5px}
}
/* OneBot 设置分组折叠面板(纯 JS 切换 class, 不依赖 details 的浏览器默认行为) */
.ob-sec{border:1px solid var(--outline-variant);border-radius:var(--radius-md);margin-bottom:8px;overflow:hidden}
.ob-sec-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:11px 13px;cursor:pointer;font-size:13px;font-weight:600;color:var(--on-surface);
  background:transparent;border:none;text-align:left;font-family:inherit;line-height:1.4;
}
.ob-sec-head:hover{background:var(--surface-variant)}
.ob-sec-head:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.ob-sec-arrow{
  flex:none;width:7px;height:7px;margin-right:3px;
  border-right:1.8px solid var(--on-surface-variant);border-bottom:1.8px solid var(--on-surface-variant);
  transform:rotate(45deg);transition:transform .18s;
}
.ob-sec.open .ob-sec-arrow{transform:rotate(-135deg)}
.ob-sec-sub{font-size:12px;font-weight:400;color:var(--on-surface-variant)}
.ob-sec-body{display:none;padding:2px 13px 13px;border-top:1px solid var(--outline-variant)}
.ob-sec.open .ob-sec-body{display:block}
.ob-sec-body .field:first-child{margin-top:12px}
/* 按手表分开的 OneBot 实例: 每块表一个小方块, 里面两列放端口 */
.ob-w{border:1px solid var(--outline-variant);border-radius:var(--radius-md);padding:11px 12px;margin-bottom:10px;background:var(--surface)}
.ob-w:last-child{margin-bottom:0}
.ob-w-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ob-w-tok{display:flex;align-items:center;gap:6px;margin-top:8px;min-width:0}
.ob-w-tok code{
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11.5px;padding:4px 8px;border-radius:6px;background:var(--surface-variant);color:var(--on-surface-variant);
}
.ob-w select{
  width:100%;padding:8px 10px;border-radius:var(--radius-md);border:1px solid var(--outline);
  background:var(--surface);color:var(--on-surface);font-family:inherit;font-size:12.5px;outline:none;
}
.ob-w select option{padding:3px 4px}
@media (max-width:600px){.ob-w-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:13px;color:var(--on-surface-variant)}
.field input{
  height:44px;padding:0 14px;border-radius:var(--radius-md);
  border:1px solid var(--outline);background:transparent;color:var(--on-surface);outline:none;
}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb, var(--primary) 24%, transparent)}
.list{display:flex;flex-direction:column;gap:8px}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--outline-variant)}
.list-item:last-child{border-bottom:none}
.list-main{min-width:0}
.list-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-sub{font-size:12px;color:var(--on-surface-variant);margin-top:2px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.empty{padding:28px 8px;text-align:center;color:var(--on-surface-variant);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.stat{padding:10px 12px;border-radius:var(--radius-md);background:var(--surface-variant);font-size:13px}
.stat b{display:block;font-size:18px;margin-top:2px}
.loading{padding:40px 0;text-align:center;color:var(--on-surface-variant);font-size:13px}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
  background:var(--on-surface);color:var(--surface);padding:12px 18px;border-radius:var(--radius-md);
  /* 要压在登录遮罩(z-index:200)和弹窗(50)之上, 否则遮罩上的操作没有反馈 */
  font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:calc(100% - 32px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:var(--error);color:#fff}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px;background:rgba(0,0,0,.4);overflow-y:auto}
.modal.hidden{display:none}
.modal-card{width:100%;max-width:420px;margin:auto;background:var(--surface);border-radius:var(--radius-xl);padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-card h2{margin:0 0 14px;font-size:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
select{
  height:44px;padding:0 12px;border-radius:var(--radius-md);
  border:1px solid var(--outline);background:var(--surface);color:var(--on-surface);outline:none;
}
.chat-wrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;align-items:start}
.chat-side{position:sticky;top:84px;max-height:calc(100vh - 120px);overflow:auto}
.chat-targets{display:flex;flex-direction:column;gap:6px}
.chat-target{padding:10px 12px;border-radius:var(--radius-md);border:1px solid transparent;text-align:left}
.chat-target.active{background:var(--primary-container);color:var(--on-primary-container)}
.chat-main{display:flex;flex-direction:column;min-height:520px}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.messages{flex:1;min-height:320px;max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px 4px}

<style>
/* ===== 极简主题(黑白灰 + 细线) ===== */
:root{

  --surface:#fafafa; --on-surface:#151515;
  --card:#ffffff; --on-card:#151515;
  --surface-variant:#f4f4f4; --on-surface-variant:#8b8b8b;
  --outline:#e3e3e3; --outline-variant:#efefef;

}
body{background:var(--surface);color:var(--on-surface);font-size:14px}

.topbar-actions{display:flex;align-items:center;gap:8px}

.hero .watch-name{font-size:19px;font-weight:600}
.battery{font-size:26px;font-weight:500}
.grid{gap:12px}
.card-title{font-size:11.5px;font-weight:500;color:var(--on-surface-variant);letter-spacing:.6px;margin-bottom:8px}
.row{font-size:13.5px;padding:11px 0;border-bottom:1px solid var(--outline-variant)}
.row:last-child{border-bottom:none}
.row .value{font-size:12.5px;color:var(--on-surface-variant)}
.btn{background:var(--primary);color:var(--on-primary);font-weight:500;border-radius:10px;min-height:40px;letter-spacing:.1px}
.btn.tonal{background:var(--surface-variant);color:var(--on-surface)}
.btn.text{background:transparent;color:var(--on-surface);padding:0 12px}
.btn.danger{background:transparent;color:var(--error);border:1px solid var(--outline)}
.btn.small{min-height:32px;border-radius:8px;font-size:12px}
.field input,select,.chat-input input{border-color:var(--outline);background:transparent;border-radius:10px;color:var(--on-surface)}
.field span{font-size:12px;color:var(--on-surface-variant)}
.messages{background:transparent;max-height:none;min-height:0;padding:6px 2px;flex:1;overflow:auto}
.bubble{background:var(--surface-variant);border:none;border-radius:14px;padding:10px 13px}
.bubble.self{background:var(--primary);border-color:transparent;color:var(--on-primary)}
.bubble img.media{display:block;max-width:240px;max-height:240px;border-radius:10px}
.bubble img.media.emoji{max-width:96px;max-height:96px;border-radius:8px;object-fit:contain;background:transparent}
.bubble video.media{display:block;max-width:260px;max-height:300px;border-radius:10px;background:#000}
.bubble audio.media{display:block;width:220px;height:36px}
.bubble .media-note{font-size:11.5px;opacity:.7;margin-top:5px}
.bubble .media-note a{color:inherit;text-decoration:underline}
.list-item{border-bottom:1px solid var(--outline-variant)}
.empty{color:var(--on-surface-variant)}
.modal-card{background:var(--card);border:1px solid var(--outline);border-radius:16px;box-shadow:none}
.toast{background:var(--on-surface);color:var(--surface);border-radius:10px}

/* ===== 页面标题 / 返回 ===== */
.page-head{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.page-head h2{margin:0;font-size:16px;font-weight:600}
.back-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:transparent;border:1px solid var(--outline);flex:none}

.nav{

  display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--outline-variant);z-index:40;
}
.nav-brand{display:none}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--on-surface-variant);padding:6px 0 4px;border-radius:10px}
.nav-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:var(--on-surface)}
.nav-center{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--on-surface-variant);padding-bottom:4px}
.nav-center .fab{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;margin-top:-20px;background:var(--primary);color:var(--on-primary);box-shadow:none}
.nav-center .fab svg{width:24px;height:24px;stroke:var(--on-primary);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ===== 聊天列表 ===== */
.chat-list{background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--outline-variant);overflow:hidden}
.chat-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--outline-variant);width:100%;text-align:left}
.chat-item:last-child{border-bottom:none}
.avatar{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:var(--on-surface);font-size:16px;font-weight:600;flex:none;background:var(--surface-variant)}
.chat-item .cmain{flex:1;min-width:0}
.chat-item .cname{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .csub{font-size:11.5px;color:var(--on-surface-variant);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .ctime{font-size:10.5px;color:var(--on-surface-variant);align-self:flex-start;padding-top:3px}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--error);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 5px;margin-top:4px}

/* ===== 聊天会话页 ===== */
.chat-page{display:flex;flex-direction:column;min-height:calc(100dvh - 190px)}
.chat-page .messages{flex:1;overflow:auto;padding:10px 2px 92px}
.chat-input-bar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom));
  width:100%;max-width:var(--app-max);display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:var(--card);border-top:1px solid var(--outline-variant);z-index:35;
}
.chat-input-bar input{flex:1;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--outline-variant);background:var(--surface-variant);color:var(--on-surface);outline:none}
.chat-input-bar .plus{width:40px;height:40px;border-radius:50%;background:var(--surface-variant);color:var(--on-surface);font-size:20px;display:grid;place-items:center;flex:none}
.chat-input-bar .send{height:40px;padding:0 16px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-weight:500;flex:none}

/* ===== 地图 ===== */
.map-wrap{position:relative;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--outline-variant);height:calc(100dvh - 280px);min-height:340px;background:#ececec}
.map-canvas{position:absolute;inset:0;cursor:grab}
.map-canvas:active{cursor:grabbing}
.map-canvas img{position:absolute;width:256px;height:256px;user-select:none;pointer-events:none}
.map-attrib{position:absolute;left:6px;top:6px;font-size:9px;color:#6a6a70;background:rgba(255,255,255,.72);padding:1px 4px;border-radius:4px;z-index:3}
.map-pin{position:absolute;width:16px;height:16px;border-radius:50% 50% 50% 0;transform:translate(-50%,-100%) rotate(-45deg);background:#111;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12);z-index:4}
.map-pin:after{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff}
.map-ctrl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:4}
.map-ctrl button{width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--outline);font-size:16px;line-height:1;color:var(--on-surface)}
.map-sheet{position:absolute;left:10px;right:10px;bottom:10px;background:var(--card);border:1px solid var(--outline-variant);border-radius:14px;padding:12px 14px;box-shadow:none;z-index:5}
.map-sheet .mtitle{font-size:14px;font-weight:500}
.map-sheet .msub{font-size:11.5px;color:var(--on-surface-variant);margin-top:3px}
.map-sheet .mactions{display:flex;gap:8px;margin-top:10px}

.fn-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--outline-variant);padding:22px 10px}

.emoji-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:52vh;overflow-y:auto;padding:2px;margin:0 -2px}
.emoji-cell{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px 7px;border-radius:12px;border:1px solid var(--outline-variant);background:var(--surface-variant);cursor:pointer;transition:border-color .15s,transform .1s}

.emoji-cell img{width:52px;height:52px;object-fit:contain;display:block}
.emoji-cell span{font-size:11px;line-height:1.2;color:var(--on-surface-variant);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emoji-cell.sending{opacity:.5;pointer-events:none}
@media (min-width: 480px){ .emoji-grid{grid-template-columns:repeat(5,1fr)} }

.app-footer{

}

}
.app-footer:hover .mascot{filter:none}
.app-footer a{color:inherit;text-decoration:none;transition:color .15s}

.app-footer a:hover b{color:var(--primary);text-decoration:underline;text-underline-offset:2px}

.auth-gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--surface)}

.auth-card input:focus{border-color:var(--primary)}
.auth-card button{height:42px;padding:0 18px;border:1px solid var(--primary);border-radius:10px;background:var(--primary);color:var(--on-primary);font-size:14px;cursor:pointer;font-family:inherit}
.auth-card button:disabled{opacity:.5;cursor:default}

/* ===== 电脑端: 左侧栏 ===== */

.card-title{position:static;padding:0;margin:0 0 16px;font-size:16px;font-weight:600;color:rgba(0,0,0,.88);letter-spacing:0}
.card-title:before{display:none}
.panel h3{color:rgba(0,0,0,.45);font-size:13px;font-weight:600;margin:0 0 12px}
.row{border-bottom:1px solid var(--outline-variant);padding:10px 0;font-size:14px;color:rgba(0,0,0,.88)}
.row:last-child{border-bottom:none}
.row .value{font-size:14px;color:rgba(0,0,0,.45)}
.muted{font-size:12px;line-height:18px;color:rgba(0,0,0,.45)}
.btn{min-height:36px;padding:0 15px;border-radius:8px;font-size:14px;font-weight:400;background:var(--primary);color:#fff;border:1px solid var(--primary);box-shadow:0 2px 0 rgba(5,145,255,.1)}
.btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn:active{background:#0958d9;border-color:#0958d9;opacity:1}
.btn.tonal{background:#fff;border:1px solid var(--outline);color:rgba(0,0,0,.88);box-shadow:none}
.btn.tonal:hover{border-color:#4096ff;color:#1677ff;background:#fff}
.btn.text{background:transparent;border:1px solid transparent;color:#1677ff;padding:0 10px;box-shadow:none}
.btn.text:hover{background:#e6f4ff}
.btn.danger{background:#fff;border:1px solid #ffa39e;color:#ff4d4f;box-shadow:none}
.btn.danger:hover{background:#fff2f0;border-color:#ff4d4f}
.btn.small{min-height:28px;padding:0 10px;font-size:12.5px;border-radius:6px}
.field input,select,.chat-input input,.chat-input-bar input,.field textarea{height:38px;padding:0 12px;border:1px solid var(--outline);border-radius:6px;background:#fff;color:rgba(0,0,0,.88);outline:none}
.field textarea{height:auto;padding:10px 12px}
.field input:focus,select:focus,.chat-input input:focus,.chat-input-bar input:focus,.field textarea:focus{border-color:#1677ff;box-shadow:0 0 0 2px rgba(5,145,255,.12)}
.field span{font-size:13px;color:rgba(0,0,0,.65)}
select{height:38px;padding:0 10px;background:#fff}
option{background:#fff;color:rgba(0,0,0,.88)}
input::placeholder,textarea::placeholder{color:rgba(0,0,0,.25)}
.switch{width:40px;height:22px}
.switch span{background:rgba(0,0,0,.25);border:0}
.switch span:before{left:3px;top:3px;width:16px;height:16px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:#1677ff;border-color:#1677ff}
.switch input:checked+span:before{left:3px;top:3px;width:16px;height:16px;transform:translateX(18px);background:#fff}
.list-item{border-bottom:1px solid var(--outline-variant)}
.list-title{font-weight:600;color:rgba(0,0,0,.88)}
.list-sub{color:rgba(0,0,0,.45)}
.avatar{background:#f5f5f5;color:rgba(0,0,0,.88);border-radius:6px;font-weight:600}
.hero-avatar{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px;background:#f5f5f5;overflow:hidden}
.chat-side .chat-list{border:none}
.chat-item.active{background:#e6f4ff}
.chat-pane-head,.side-note{border-color:var(--outline-variant)}
.bubble{background:#f5f5f5;border-radius:8px;color:rgba(0,0,0,.88)}
.bubble.self{background:#1677ff;color:#fff}
.chat-input-bar .send{background:#1677ff;border-radius:6px;font-weight:400}
.chat-input-bar .plus{background:#f5f5f5;color:rgba(0,0,0,.65)}
.entry{background:#fff;border:1px solid var(--outline-variant);border-radius:6px;color:rgba(0,0,0,.88)}
.entry:hover{background:#fafafa;border-color:#d9d9d9}
.entry i{background:#f5f5f5;color:rgba(0,0,0,.45);border-radius:6px}
.back-btn{border-radius:6px;border:1px solid var(--outline);width:32px;height:32px}
.back-btn svg{stroke:rgba(0,0,0,.65)}
.page-head h2{font-size:16px;font-weight:600;color:rgba(0,0,0,.88)}
.modal{background:rgba(0,0,0,.45)}
.modal-card{border-radius:8px;border:1px solid transparent;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.08),0 9px 28px 8px rgba(0,0,0,.05);padding:24px}
.modal-card h2{margin:0 0 16px;font-size:18px;font-weight:600;color:rgba(0,0,0,.88)}
.toast{background:#fff;border:1px solid var(--outline-variant);color:rgba(0,0,0,.88);border-radius:8px;font-size:13px;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.toast.error{background:#fff2f0;border-color:#ffccc7;color:#ff4d4f}
.map-wrap{border-color:var(--outline-variant);background:#f5f5f5}
.map-ctrl button{background:#fff;border-color:var(--outline);color:rgba(0,0,0,.88)}
.map-sheet{background:#fff;border-radius:8px;border-color:var(--outline-variant);box-shadow:var(--shadow)}
.map-pin{background:#1677ff;border-color:#fff}
.map-attrib{background:rgba(255,255,255,.8);color:rgba(0,0,0,.45)}
.stat{border-radius:6px;background:#f5f5f5}
.badge{background:#ff4d4f;color:#fff}
.lost-photos a{border-color:var(--outline-variant);border-radius:6px}
.lost-photos .meta{color:rgba(0,0,0,.45)}
.empty,.loading{color:rgba(0,0,0,.45)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d9d9d9;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
/* 登录遮罩是全屏的, 会把顶栏连同主题按钮一起盖住, 所以这里单独放一个 */
.gate-theme{
  position:absolute;top:16px;right:16px;width:34px;height:34px;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--outline);border-radius:50%;
  background:var(--surface-variant);color:var(--on-surface-variant);cursor:pointer;
  transition:color .15s,border-color .15s,background .15s;
}
.gate-theme:hover{color:var(--primary);border-color:var(--primary)}
.gate-theme svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
@media (max-width:900px){
  .nav-toggle{display:flex}
  .app-body{display:block}
  .nav{position:fixed;left:8px;top:72px;bottom:auto;width:220px;height:auto;flex-direction:column;align-items:stretch;gap:2px;padding:8px;background:#fff;border:1px solid var(--outline-variant);border-right:1px solid var(--outline-variant);border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.12);display:none;z-index:55}
  .nav.open{display:flex}
  .nav-item{width:100%;height:40px;justify-content:flex-start;gap:10px;padding:0 10px}
  .nav-item span{display:inline;font-size:14px;color:inherit}
  .nav-item:after{display:none}
  main{margin-left:0;width:100%;padding:16px}
  .header-inner{height:56px;padding:0 12px}
  .app-header{height:64px}
  .page-head-main h1{font-size:18px}
}

/* ==========================================================================
   深色模式
   说明: 上面几层主题里有大量硬编码的浅色值(rgba(0,0,0,.88) / #fff / #f5f5f5),
   只覆盖 CSS 变量盖不住, 所以这里按「变量 + 具体规则」两层一起覆盖。
   JS 会把 auto 解析成具体的 light / dark 写到 <html data-theme> 上。
   ========================================================================== */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg-body:#141414; --bg-layout:transparent; --bg-container:#1f1f1f; --bg-elevated:#262626;
  --primary:#1677ff; --primary-hover:#4096ff; --on-primary:#ffffff;
  --primary-container:#111d2c; --on-primary-container:#4096ff;
  --surface:#1f1f1f; --on-surface:rgba(255,255,255,.85);
  --card:rgba(31,31,31,.88); --on-card:rgba(255,255,255,.85);
  --surface-variant:#262626; --on-surface-variant:rgba(255,255,255,.45);
  --outline:#424242; --outline-variant:#303030;
  --error:#ff7875; --success:#49aa19;
  --shadow:0 1px 2px 1px rgba(0,0,0,.4);
}
:root[data-theme="dark"] body{
  background:
    radial-gradient(1100px 520px at 8% -10%, rgba(22,119,255,.10) 0%, rgba(22,119,255,0) 62%),
    radial-gradient(900px 480px at 100% 0%, rgba(255,255,255,.045) 0%, rgba(255,255,255,0) 58%),
    #141414;
  color:var(--on-surface);
}
/* 顶栏在两种主题下都是深色胶囊, 只把阴影压暗一点 */
:root[data-theme="dark"] .header-inner{background:rgba(20,20,20,.82);box-shadow:0 8px 24px rgba(0,0,0,.45)}
/* 侧栏 / 手机抽屉 */
:root[data-theme="dark"] .nav{background:rgba(31,31,31,.9);border-right-color:var(--outline-variant)}
:root[data-theme="dark"] .nav-item{color:rgba(255,255,255,.72)}
:root[data-theme="dark"] .nav-item:hover{background:#262626;color:rgba(255,255,255,.9)}
:root[data-theme="dark"] .nav-item.active{background:#111d2c;color:#4096ff}
/* 页面标题 */
:root[data-theme="dark"] .page-head-main h1{color:rgba(255,255,255,.88)}
:root[data-theme="dark"] .page-head-main p{color:rgba(255,255,255,.45)}
:root[data-theme="dark"] .page-head h2{color:rgba(255,255,255,.88)}
:root[data-theme="dark"] .back-btn svg{stroke:rgba(255,255,255,.65)}
/* 手表切换条 */
:root[data-theme="dark"] .watch-chip{background:rgba(255,255,255,.06);border-color:var(--outline);color:rgba(255,255,255,.72)}
:root[data-theme="dark"] .watch-chip:hover{border-color:#4096ff;color:#4096ff}
:root[data-theme="dark"] .watch-chip.active{background:#111d2c;border-color:#15325b;color:#4096ff}
:root[data-theme="dark"] .watch-chip.active .dot{background:#4096ff}
/* 标签页 */
:root[data-theme="dark"] .tab{color:rgba(255,255,255,.65)}
:root[data-theme="dark"] .tab:hover{color:#4096ff}
:root[data-theme="dark"] .tab.active{color:#4096ff;border-bottom-color:#4096ff}
/* 卡片与文字 */
:root[data-theme="dark"] .card,
:root[data-theme="dark"] .hero,
:root[data-theme="dark"] .panel,
:root[data-theme="dark"] .chat-side,
:root[data-theme="dark"] .chat-main{border-color:rgba(255,255,255,.07);box-shadow:0 1px 2px 1px rgba(0,0,0,.35)}
:root[data-theme="dark"] .hero .watch-name{color:rgba(255,255,255,.88)}
:root[data-theme="dark"] .card-title{color:rgba(255,255,255,.88)}
:root[data-theme="dark"] .panel h3{color:rgba(255,255,255,.45)}
:root[data-theme="dark"] .row{color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .row .value{color:rgba(255,255,255,.45)}
:root[data-theme="dark"] .muted{color:rgba(255,255,255,.45)}
:root[data-theme="dark"] .list-title{color:rgba(255,255,255,.88)}
:root[data-theme="dark"] .list-sub{color:rgba(255,255,255,.45)}
:root[data-theme="dark"] .empty,
:root[data-theme="dark"] .loading{color:rgba(255,255,255,.45)}
/* 按钮 */
:root[data-theme="dark"] .btn.text{color:#4096ff}
:root[data-theme="dark"] .btn.text:hover{background:#111d2c}
:root[data-theme="dark"] .btn.tonal{background:#1f1f1f;border-color:var(--outline);color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .btn.tonal:hover{border-color:#4096ff;color:#4096ff;background:#1f1f1f}
:root[data-theme="dark"] .btn.danger{background:#1f1f1f;border-color:#58181c;color:#ff7875}
:root[data-theme="dark"] .btn.danger:hover{background:#2a1215;border-color:#ff7875}
:root[data-theme="dark"] .btn:active{background:#0958d9;border-color:#0958d9}
/* 表单 */
:root[data-theme="dark"] .field input,
:root[data-theme="dark"] select,
:root[data-theme="dark"] .chat-input input,
:root[data-theme="dark"] .chat-input-bar input,
:root[data-theme="dark"] .field textarea{background:#1f1f1f;color:rgba(255,255,255,.85);border-color:var(--outline)}
:root[data-theme="dark"] select{background:#1f1f1f}
:root[data-theme="dark"] option{background:#1f1f1f;color:rgba(255,255,255,.85)}
:root[data-theme="dark"] input::placeholder,
:root[data-theme="dark"] textarea::placeholder{color:rgba(255,255,255,.25)}
:root[data-theme="dark"] .field span{color:rgba(255,255,255,.65)}
:root[data-theme="dark"] .switch span{background:rgba(255,255,255,.25)}
/* 头像 / 聊天气泡 / 输入条 */
:root[data-theme="dark"] .avatar,
:root[data-theme="dark"] .hero-avatar{background:#262626;color:rgba(255,255,255,.88)}
:root[data-theme="dark"] .chat-item.active{background:#111d2c}
:root[data-theme="dark"] .bubble{background:#262626;color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .bubble.self{background:#1677ff;color:#fff}
:root[data-theme="dark"] .chat-input-bar .plus{background:#262626;color:rgba(255,255,255,.65)}
/* 功能宫格 */
:root[data-theme="dark"] .entry{background:#1f1f1f;border-color:var(--outline-variant);color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .entry:hover{background:#262626;border-color:var(--outline)}
:root[data-theme="dark"] .entry i{background:#262626;color:rgba(255,255,255,.45)}
:root[data-theme="dark"] .stat{background:#262626}
/* 弹窗 / 提示 */
:root[data-theme="dark"] .modal-card{background:#1f1f1f;box-shadow:0 6px 16px rgba(0,0,0,.5),0 9px 28px 8px rgba(0,0,0,.35)}
:root[data-theme="dark"] .modal-card h2{color:rgba(255,255,255,.88)}
:root[data-theme="dark"] .toast{background:#1f1f1f;border-color:var(--outline-variant);color:rgba(255,255,255,.85);box-shadow:0 6px 16px rgba(0,0,0,.5)}
:root[data-theme="dark"] .toast.error{background:#2a1215;border-color:#58181c;color:#ff7875}
/* 地图 */
:root[data-theme="dark"] .map-wrap{background:#262626;border-color:var(--outline-variant)}
:root[data-theme="dark"] .map-ctrl button{background:#1f1f1f;border-color:var(--outline);color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .map-sheet{background:#1f1f1f;border-color:var(--outline-variant)}
:root[data-theme="dark"] .map-attrib{background:rgba(0,0,0,.6);color:rgba(255,255,255,.45)}
/* 滚动条 */

/* 手机端抽屉 */
@media (max-width:900px){
  :root[data-theme="dark"] .nav{background:#1f1f1f;border-color:var(--outline-variant);box-shadow:0 6px 16px rgba(0,0,0,.5)}
}
/* 主题切换按钮 */
.theme-btn{width:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.theme-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
/* ===== 实时日志 ===== */
.log-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.log-toolbar select{
  height:30px;padding:0 8px;border-radius:8px;font-size:12.5px;
  border:1px solid var(--outline-variant);background:var(--card);color:var(--on-card);
}
.log-auto{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--on-surface-variant);cursor:pointer}
.log-auto input{width:15px;height:15px;margin:0}
.log-body{
  height:calc(100vh - 330px);min-height:260px;overflow:auto;
  background:var(--card);color:var(--on-card);
  border:1px solid var(--outline-variant);border-radius:var(--radius-md);
  padding:8px 10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:12px;line-height:1.7;
  -webkit-overflow-scrolling:touch;
}
.log-line{display:flex;gap:8px;padding:1px 0;white-space:pre-wrap;word-break:break-word}
.log-line.lg-error{border-left:2px solid var(--error);margin-left:-10px;padding-left:8px}
.log-t{flex:none;color:var(--outline)}
.log-tag{flex:none;font-weight:600;min-width:42px}
.log-cat{flex:none;color:var(--outline)}
.log-msg{flex:1;min-width:0}
.log-line.lg-error .log-msg{color:var(--error)}
.log-tag.lg-debug{color:var(--outline)}
.log-tag.lg-info{color:var(--primary)}
.log-tag.lg-warn{color:#b26a00}
.log-tag.lg-error{color:var(--error)}
.log-tag.lg-http{color:var(--success)}
.log-tag.lg-api{color:#0b7285}
[data-theme="dark"] .log-tag.lg-warn{color:#ffb74d}
[data-theme="dark"] .log-tag.lg-api{color:#66d9e8}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .log-tag.lg-warn{color:#ffb74d}
  :root:not([data-theme="light"]) .log-tag.lg-api{color:#66d9e8}
}
@media (max-width:600px){
  .log-body{height:calc(100vh - 380px);min-height:220px;font-size:11.5px}
  .log-tag{min-width:38px}
}

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fmtTime(ts){
    if (ts == null || ts === '') return '-';
    var n = Number(ts);
    if (!isFinite(n) || !n) return '-';
    if (n < 1e12) n *= 1000;
    try { return new Date(n).toLocaleString('zh-CN', { hour12:false }); } catch(e){ return String(ts); }
  }

    if (!isFinite(n) || !n) return '-';
    var d = new Date(n);
    var p = function(x){ return String(x).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  // ===== 极简 Markdown 渲染(零依赖, 只覆盖公告常用语法) =====
  // 支持: 标题 / 粗体 / 斜体 / 删除线 / 行内代码 / 代码块 / 链接 / 图片 / 有序无序列表 / 引用 / 分割线 / 表格
  // 安全: 先整体 esc 再拼标签, 原文里的 HTML 一律当文本
  function mdToHtml(src){
    var s = String(src == null ? '' : src).replace(/\r\n?/g, '\n');
    var blocks = [], inls = [];

    function safeUrl(u){
      var v = String(u || '').trim();
      // esc 之后 javascript: 之类不会变形, 这里直接拦掉
      if (/^(javascript|vbscript|data:text\/html)/i.test(v)) return '#';
      return v;
    }

    // 1) 先抽出代码块, 免得里面的 * # | 被当成语法
    s = s.replace(/```[ \t]*[\w+-]*\n([\s\S]*?)```/g, function(_, code){
      blocks.push('<pre class="md-pre"><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
      return '\u0000B' + (blocks.length - 1) + '\u0000';
    });
    // 2) 行内代码
    s = s.replace(/`([^`\n]+)`/g, function(_, code){
      inls.push('<code class="md-code">' + esc(code) + '</code>');
      return '\u0000I' + (inls.length - 1) + '\u0000';
    });

    function inline(t){
      var h = esc(t);
      h = h.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g, function(_, alt, url, title){
        return '<img class="md-img" src="' + safeUrl(url) + '" alt="' + alt + '" loading="lazy"' +
          (title ? ' title="' + title + '"' : '') + '>';
      });
      h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(_, text, url){
        return '<a href="' + safeUrl(url) + '" target="_blank" rel="noopener noreferrer">' + text + '</a>';
      });
      h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      h = h.replace(/~~([^~]+)~~/g, '<del>$1</del>');
      return h;
    }

    var lines = s.split('\n'), out = [], i = 0;
    function isTableSep(x){ return /^\s*\|?[\s:-]*-[\s|:-]*$/.test(x) && x.indexOf('-') >= 0; }
    function isBlockStart(x){
      return /^\s*$/.test(x) || /^#{1,6}\s/.test(x) || /^\s*[-*+]\s+/.test(x) ||
        /^\s*\d+\.\s+/.test(x) || /^\s*>\s?/.test(x) || /^\s*(---+|\*\*\*+|___+)\s*$/.test(x);
    }

    while (i < lines.length) {
      var line = lines[i], m;
      if (/^\s*$/.test(line)) { i++; continue; }
      if ((m = /^(#{1,6})\s+(.*)$/.exec(line))) {
        out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); i++; continue;
      }
      if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
      if (/^\s*>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) { q.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
        out.push('<blockquote>' + q.map(inline).join('<br>') + '</blockquote>');
        continue;
      }
      if (/^\s*[-*+]\s+/.test(line)) {
        var ul = [];
        while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
          ul.push('<li>' + inline(lines[i].replace(/^\s*[-*+]\s+/, '')) + '</li>'); i++;
        }
        out.push('<ul>' + ul.join('') + '</ul>');
        continue;
      }
      if (/^\s*\d+\.\s+/.test(line)) {
        var ol = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          ol.push('<li>' + inline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'); i++;
        }
        out.push('<ol>' + ol.join('') + '</ol>');
        continue;
      }
      if (line.indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var cells = function(row){
          return row.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(function(c){ return c.trim(); });
        };
        var head = cells(line);
        i += 2;
        var rows = [];
        while (i < lines.length && lines[i].indexOf('|') >= 0 && !/^\s*$/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
        out.push('<table><thead><tr>' + head.map(function(c){ return '<th>' + inline(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' + rows.map(function(r){
            return '<tr>' + r.map(function(c){ return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>');
        continue;
      }
      // 普通段落: 连续非空行合并, 行内换行保留为 <br>
      var para = [];
      while (i < lines.length && !isBlockStart(lines[i])) {
        // 下一行是表格分隔行时, 当前行要留给表格分支, 否则表头会被吞进段落
        if (lines[i].indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1])) break;
        para.push(inline(lines[i])); i++;
      }
      if (!para.length) { i++; continue; }
      out.push('<p>' + para.join('<br>') + '</p>');
    }

    var html = out.join('\n');
    html = html.replace(/\u0000B(\d+)\u0000/g, function(_, n){ return blocks[+n]; });
    html = html.replace(/\u0000I(\d+)\u0000/g, function(_, n){ return inls[+n]; });
    return html;
  }

  function toast(msg, isError){
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function(){ t.className = 'toast'; }, 2600);
  }

  // 单个接口最长等 30 秒。平台接口偶尔会长时间不返回(网络抖动 / 服务端排队),
  // 没有超时的话页面就一直停在「加载中…」。要更久的调用自己传 timeout(毫秒), 传 0 表示不限。
  var API_TIMEOUT = 30000;
  async function api(path, opts){
    opts = opts || {};
    var ms = opts.timeout === undefined ? API_TIMEOUT : Number(opts.timeout);
    var ac = null, timer = null, o = opts;
    if (ms > 0 && typeof AbortController !== 'undefined' && !opts.signal) {
      ac = new AbortController();
      o = Object.assign({}, opts, { signal: ac.signal });
      timer = setTimeout(function(){ try { ac.abort(); } catch(e){} }, ms);
    }
    var r, j;
    try {
      r = await fetch(path, o);
      j = await r.json();
    } catch(e){
      if (ac && ac.signal.aborted) throw new Error('请求超时（' + Math.round(ms / 1000) + ' 秒没响应）');
      throw e;
    } finally {
      if (timer) clearTimeout(timer);
    }
    if (r.status === 401 || j.unauthorized) {
      showGate('登录状态已失效，请重新输入访问令牌');
      throw new Error('需要访问令牌');
    }
    if (!j.ok) throw new Error(j.error || '请求失败');
    return j.data;
  }

  // ===== 访问令牌登录 =====
  function showGate(msg){
    var g = $('#authGate'); if (!g) return;
    g.classList.remove('hidden');
    var e = $('#authErr'); if (e) e.textContent = msg || '';
    var i = $('#authToken');
    if (i) { i.value = ''; try { i.focus(); } catch(x){} }
  }
  function hideGate(){ var g = $('#authGate'); if (g) g.classList.add('hidden'); }

  async function submitToken(ev){
    if (ev) ev.preventDefault();
    var v = ($('#authToken').value || '').trim();
    if (!v) { $('#authErr').textContent = '请输入访问令牌'; return; }
    var btn = $('#authBtn');
    btn.disabled = true;
    $('#authErr').textContent = '';
    try {
      var r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: v })
      });
      var j = await r.json();
      if (!j.ok) throw new Error(j.error || '令牌不正确');
      hideGate();
      await boot();
    } catch(e){
      $('#authErr').textContent = e.message;
    } finally {
      btn.disabled = false;
    }
  }
  $('#authForm').addEventListener('submit', submitToken);

  function closeModal(){ $('#modal').classList.add('hidden'); $('#modalCard').innerHTML = ''; }

  function openForm(title, fields, submitText, onSubmit){
    var html = '<h2>' + esc(title) + '</h2><form id="modalForm">';
    fields.forEach(function(f){
      if (f.type === 'select') {
        var opts = (f.options || []).map(function(o){
          return '<option value="' + esc(o.value) + '"' + (String(o.value) === String(f.value) ? ' selected' : '') + '>' + esc(o.label) + '</option>';
        }).join('');
        html += '<label class="field"><span>' + esc(f.label) + '</span><select name="' + esc(f.name) + '">' + opts + '</select></label>';
        return;
      }
      if (f.type === 'textarea') {
        html += '<label class="field"><span>' + esc(f.label) + '</span>' +
          '<textarea name="' + esc(f.name) + '" rows="4" placeholder="' + esc(f.placeholder || '') + '"' + (f.required ? ' required' : '') + '>' +
          esc(f.value == null ? '' : f.value) + '</textarea></label>';
        return;
      }
      html += '<label class="field"><span>' + esc(f.label) + '</span>' +
        '<input name="' + esc(f.name) + '" type="' + esc(f.type || 'text') + '" value="' + esc(f.value == null ? '' : f.value) + '" placeholder="' + esc(f.placeholder || '') + '"' + (f.required ? ' required' : '') + '></label>';
    });
    html += '<div class="modal-actions"><button type="button" class="btn text" id="modalCancel">取消</button>' +
      '<button type="submit" class="btn">' + esc(submitText) + '</button></div></form>';
    $('#modalCard').innerHTML = html;
    $('#modal').classList.remove('hidden');
    $('#modalCancel').onclick = closeModal;
    $('#modalForm').onsubmit = async function(ev){
      ev.preventDefault();
      var vals = {};
      new FormData(ev.target).forEach(function(v, k){ vals[k] = v; });
      try { await onSubmit(vals); closeModal(); }
      catch(e){ toast(e.message, true); }
    };
  }

  function openInfo(title, bodyHtml){
    $('#modalCard').innerHTML = '<h2>' + esc(title) + '</h2><div>' + bodyHtml + '</div>' +
      '<div class="modal-actions"><button class="btn text" id="infoClose">关闭</button></div>';

  // 表情选择器: 以图片九宫格展示表情包, 点击缩略图直接发送
  // onPick(index) 返回 true 表示发送成功(关闭弹窗), false 保持打开便于重试
  async function openEmojiPicker(onPick){
    var d;
    try { d = await api('/api/chats/emojis'); }
    catch(e){ toast(e.message, true); return; }
    var list = d.emojis || [];
    if (!list.length) { toast('表情列表为空', true); return; }

    var cells = list.map(function(e){
      var thumb = e.url
        ? '<img src="' + esc(e.url) + '" alt="' + esc(e.desc) + '" loading="lazy">'
        : '<span class="fn-icon" style="width:52px;height:52px">' + esc(String(e.desc || '?').slice(0, 1)) + '</span>';
      return '<button type="button" class="emoji-cell" data-index="' + esc(e.index) + '" title="' + esc(e.desc) + '">' +
        thumb + '<span>' + esc(e.desc) + '</span></button>';
    }).join('');

    $('#modalCard').innerHTML = '<h2>发送表情</h2>' +
      '<div class="emoji-grid">' + cells + '</div>' +

    $('#modal').classList.remove('hidden');
    $('#emojiCancel').onclick = closeModal;

    Array.prototype.forEach.call($('#modalCard').querySelectorAll('.emoji-cell'), function(btn){
      btn.onclick = async function(){
        btn.classList.add('sending');

  function confirmDialog(message){
    return new Promise(function(resolve){
      $('#modalCard').innerHTML = '<h2>确认操作</h2><p class="muted">' + esc(message) + '</p>' +
        '<div class="modal-actions"><button class="btn text" id="confirmNo">取消</button>' +
        '<button class="btn danger" id="confirmYes">确认</button></div>';
      $('#modal').classList.remove('hidden');
      $('#confirmNo').onclick = function(){ closeModal(); resolve(false); };
      $('#confirmYes').onclick = function(){ closeModal(); resolve(true); };
    });

  var VERIFY_MODE_NAMES = { 1:'旧设备验证', 2:'家庭成员验证', 3:'短信验证码', 4:'密保问题', 6:'其它方式' };

  // 新设备登录: 选择密保问题并提交答案
  async function startVerifyDialog(account, challenge){
    var r;
    try {
      r = await api('/api/account/verify/questions', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ account: account, checkCode: challenge.checkCode })
      });
    } catch(e){ toast(e.message, true); return; }

    var qs = r.questions || [];
    if (!qs.length) { toast('没有可用的密保问题', true); return; }

    var modes = (challenge.checkTypes || []).map(function(t){ return VERIFY_MODE_NAMES[t] || ('方式 ' + t); });
    var defIdx = 0;
    qs.forEach(function(q, i){ if (/天才号/.test(q.question || '')) defIdx = i; });
    var opts = qs.map(function(q, i){
      return '<option value="' + esc(q.questionId) + '"' + (i === defIdx ? ' selected' : '') + '>' + esc(q.question) + '</option>';
    }).join('');

    $('#modalCard').innerHTML = '<h2>新设备验证</h2>' +
      '<p class="muted">账号 ' + esc(account) + ' 在新设备登录，需要完成安全验证。' +
      (modes.length ? '<br>服务端提供: ' + esc(modes.join(' / ')) : '') + '</p>' +
      '<label class="field"><span>密保问题</span><select id="vqQuestion">' + opts + '</select></label>' +
      '<label class="field"><span id="vqHint">答案</span><input id="vqAnswer" placeholder="请输入答案"></label>' +
      '<div class="modal-actions"><button class="btn text" id="vqCancel">取消</button>' +
      '<button class="btn" id="vqSubmit">验证</button></div>';
    $('#modal').classList.remove('hidden');
    $('#vqCancel').onclick = closeModal;

    function currentQ(){
      var id = $('#vqQuestion').value;
      for (var i = 0; i < qs.length; i++) if (String(qs[i].questionId) === String(id)) return qs[i];
      return null;
    }
    function syncHint(){
      var q = currentQ();
      $('#vqHint').textContent = (q && q.content) || '答案';
    }
    $('#vqQuestion').onchange = syncHint;
    syncHint();

    $('#vqSubmit').onclick = async function(){
      var answer = $('#vqAnswer').value.trim();
      var q = currentQ();
      if (!q) { toast('请选择密保问题', true); return; }
      if (!answer) { toast('请输入答案', true); return; }
      this.disabled = true;
      try {
        await api('/api/account/verify/question', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ account: account, checkCode: challenge.checkCode, questionId: q.questionId, answer: answer })
        });
        closeModal();
        toast('登录成功');
        var w = await api('/api/watches?refresh=1');
        state.watches = w.watches || [];
        if (state.watches.length) state.id = state.watches[0].watchId;
        renderStrip(); load();
      } catch(e){ toast(e.message, true); }
      finally { this.disabled = false; }
    };
  }

  function currentWatch(){
    for (var i = 0; i < state.watches.length; i++) if (state.watches[i].watchId === state.id) return state.watches[i];
    return null;

        '<span class="dot' + dot + '"></span>' + esc(w.name || w.watchId) +

  function navActive(){

    // 日志是从「我的」进来的诊断页, 高亮跟着「我的」走

  function renderNav(){

        NAV_ICONS[n.icon] + '<span>' + n.label + '</span></button>';

  var navToggleBtn = $('#navToggle');

  // 加载兜底: 12 秒还没渲染出内容就给个「重试」按钮, 不让页面永远停在「加载中…」
  var loadWatchdog = 0;
  function setLoading(){
    $('#content').innerHTML = '<div class="loading">加载中…</div>';
    if (loadWatchdog) { clearTimeout(loadWatchdog); loadWatchdog = 0; }
    loadWatchdog = setTimeout(function(){
      loadWatchdog = 0;
      var c = $('#content');
      if (!c || !c.querySelector('.loading')) return;   // 已经渲染出来了
      c.innerHTML = '<div class="empty">加载超时了，服务端没有响应。<br>' +
        '（网络或平台接口卡住时会出现这个，点下面重试即可）<br>' +
        '<button class="btn small tonal" id="retryLoad" style="margin-top:12px">重试</button></div>';
      var b = $('#retryLoad');
      if (b) b.onclick = function(){ load(); };

  }

  function addBackBar(){

    head.className = 'page-head';
    head.innerHTML = '<button class="back-btn" id="backBtn"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>' +
      '<h2>' + esc(PAGE_TITLES[state.tab] || '') + '</h2>';
    c.insertBefore(head, c.firstChild);
    $('#backBtn').onclick = function(){
      // 从主页进来的页面(公告)退回主页, 其余仍退回「功能」
      var back = state.backTo || 'more';
      state.tab = back;
      state.backTo = null;
      state.noticeId = null;
      renderNav(); updateTitle(); load();
    };
  }

  // 每次 load() 自增, 用来丢掉「先发出去、后回来」的过期请求结果
  var loadSeq = 0;
  async function load(){
    var seq = ++loadSeq;
    if (state.chatPoll) { clearInterval(state.chatPoll); state.chatPoll = null; }
    if (state.homePoll) { clearInterval(state.homePoll); state.homePoll = null; }
    // 离开日志页必须断开 SSE, 否则会一直挂着一条长连接在后台推数据
    stopLogStream();
    var navBox = $('#nav');
    if (navBox) navBox.classList.remove('open');
    var nt = $('#navToggle');
    if (nt) nt.setAttribute('aria-expanded', 'false');
    destroyMap();
    setLoading();
    if (!state.id && ['home', 'announcements', 'account', 'bind', 'ai', 'chat', 'more', 'me', 'logs'].indexOf(state.tab) < 0) {
      $('#content').innerHTML = '<div class="empty">没有已绑定的手表，请先在「绑定」页添加手表</div>';
      return;
    }
    var id = state.id ? encodeURIComponent(state.id) : '';
    // 取数回来时如果已经切到别的页了, 直接丢掉, 否则旧内容会盖掉新页面
    function run(p, render){
      return p.then(function(d){ if (seq === loadSeq) render(d); });
    }
    try {
      if (state.tab === 'home') await run(api('/api/system'), renderHome);
      else if (state.tab === 'announcements') await renderAnnouncements();
      else if (state.tab === 'chat') await run(api('/api/chats'), renderChat);
      else if (state.tab === 'location') await run(api('/api/watch/' + id + '/location'), renderLocation);
      else if (state.tab === 'more') {
        var caps = state.id ? await tryApi('/api/watch/' + id + '/capabilities') : null;
        if (seq === loadSeq) renderMore(caps);
      }
      else if (state.tab === 'me') {
        var acc = (await tryApi('/api/account')) || {};
        // 手表信息失败要说一声, 否则页面会像"没绑定手表"一样空着, 用户不知道是接口挂了
        var ov = null, ovErr = '';
        if (state.id) {
          try { ov = await api('/api/watch/' + id + '/overview'); }
          catch(e){ ovErr = e.message; }
        }
        if (seq === loadSeq) {
          renderMe(acc, ov);
          if (ovErr) toast('手表信息加载失败：' + ovErr, true);
        }
      }
      else if (state.tab === 'overview') await run(api('/api/watch/' + id + '/overview'), renderOverview);
      else if (state.tab === 'health') await run(api('/api/watch/' + id + '/health'), renderHealth);
      else if (state.tab === 'contacts') await run(api('/api/watch/' + id + '/contacts'), renderContacts);
      else if (state.tab === 'friends') await run(api('/api/watch/' + id + '/friends'), renderFriends);
      else if (state.tab === 'profile') await run(api('/api/watch/' + id + '/profile'), renderProfile);
      else if (state.tab === 'guard') await run(api('/api/watch/' + id + '/guard'), renderGuard);
      else if (state.tab === 'settings') await run(api('/api/watch/' + id + '/settings'), renderSettings);
      else if (state.tab === 'apps') await run(api('/api/watch/' + id + '/apps'), renderApps);
      else if (state.tab === 'wifi') await run(api('/api/watch/' + id + '/wifi'), renderWifi);
      else if (state.tab === 'alarms') await run(api('/api/watch/' + id + '/alarms'), renderAlarms);
      else if (state.tab === 'hidden') await run(api('/api/watch/' + id + '/hidden'), renderHidden);
      else if (state.tab === 'ai') await run(api('/api/ai'), renderAi);
      else if (state.tab === 'account') await run(api('/api/account'), renderAccount);
      else if (state.tab === 'logs') await renderLogs();
      else if (state.tab === 'bind') renderBind();
      if (seq !== loadSeq) return;
      addBackBar();
      updateTitle();
      renderNav();
    } catch(e){
      if (seq !== loadSeq) return;
      $('#content').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    } finally {
      // 只有最新那次 load 才能清掉看门狗, 否则快速切页时会把新页面的兜底计时器干掉
      if (seq === loadSeq && loadWatchdog) { clearTimeout(loadWatchdog); loadWatchdog = 0; }
    }
  }

  // ===== 公告 =====
  // 公告内容由独立部署的私有公告服务提供, 客户端只负责拉取与渲染
  function goAnnouncements(id){
    state.noticeId = id || null;
    state.backTo = 'home';
    state.tab = 'announcements';
    renderNav(); updateTitle(); load();
  }

  // 主页公告卡: 置顶优先, 最多 2 条; 服务不可用/没有公告时整块不显示
  async function loadHomeNotices(){
    var box = $('#homeNotice');
    if (!box) return;
    var d;
    try { d = await api('/api/announcements'); } catch (e) { box.innerHTML = ''; return; }
    var list = (d && d.notices) || [];
    if (!list.length) { box.innerHTML = ''; return; }
    var top = list.slice(0, 2);
    var html = '<div class="card notice-card">' +
      '<div class="notice-head"><span class="card-title" style="margin:0">公告</span>' +
      '<button class="btn small text" id="noticeAll">查看全部' + (list.length > 2 ? ' · ' + list.length : '') + ' ›</button></div>';
    html += top.map(function(n){
      return '<button class="notice-item" data-nid="' + esc(n.id) + '">' +
        '<div class="notice-title">' + (n.pinned ? '<span class="notice-pin">置顶</span>' : '') + esc(n.title) + '</div>' +
        '<div class="notice-sub">' + fmtDate(n.updatedAt || n.createdAt) +
        (n.summary ? ' · ' + esc(n.summary) : '') + '</div></button>';
    }).join('');
    html += '</div>';
    box.innerHTML = html;
    var all = $('#noticeAll');
    if (all) all.onclick = function(){ goAnnouncements(null); };
    Array.prototype.forEach.call(box.querySelectorAll('[data-nid]'), function(b){
      b.onclick = function(){ goAnnouncements(b.getAttribute('data-nid')); };
    });
  }

  async function renderAnnouncements(){
    var d;
    try { d = await api('/api/announcements'); } catch (e) {
      $('#content').innerHTML = '<div class="card"><div class="empty">公告加载失败：' + esc(e.message) + '</div></div>';
      return;
    }
    var list = (d && d.notices) || [];
    if (!list.length) {
      $('#content').innerHTML = '<div class="card"><div class="empty">' +
        (d && d.error ? '公告服务暂时不可用，请稍后再试。' : '暂无公告') +
        '</div></div>';
      return;
    }
    if (!state.noticeId) return renderNoticeList(list, d);

    // 详情: 列表里找不到(可能刚被删)就退回列表
    if (!list.some(function(x){ return x.id === state.noticeId; })) {
      state.noticeId = null;
      return renderNoticeList(list, d);
    }
    var det;
    try { det = await api('/api/announcements/' + encodeURIComponent(state.noticeId)); } catch (e) {
      toast(e.message, true);
      state.noticeId = null;
      return renderNoticeList(list, d);
    }
    renderNoticeDetail(det.notice);
  }

  function renderNoticeList(list, meta){
    var html = '<div class="notice-page"><div class="notice-page-head">' +
      '<span class="muted">共 ' + list.length + ' 条 · 置顶优先' +
      (meta && meta.error ? ' · 离线缓存' : '') + '</span>' +
      '<button class="btn small tonal" id="noticeRefresh">刷新</button></div>' +
      '<div class="card"><div class="notice-list">';
    html += list.map(function(n){
      return '<button class="notice-row" data-nid="' + esc(n.id) + '">' +
        '<div class="notice-row-main">' +
        '<div class="notice-title">' + (n.pinned ? '<span class="notice-pin">置顶</span>' : '') + esc(n.title) + '</div>' +
        '<div class="notice-sub">' + fmtDate(n.updatedAt || n.createdAt) +
        (n.summary ? ' · ' + esc(n.summary) : '') + '</div></div>' +

        // 重渲染会把页头一起冲掉, 补回来
        addBackBar();

  function renderNoticeDetail(n){
    var html = '<div class="notice-page">' +
      '<button class="btn small text" id="noticeBack" style="margin:0 0 6px -10px">‹ 返回列表</button>' +

      (n.pinned ? '<span class="notice-pin">置顶</span>' : '') + esc(n.title) + '</h2>' +
      '<div class="notice-detail-meta">发布于 ' + fmtTime(n.createdAt) +
