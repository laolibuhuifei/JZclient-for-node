  // ===== 主页仪表盘 =====
  var OS_LABEL = { darwin:'macOS', linux:'Linux', win32:'Windows', freebsd:'FreeBSD', openbsd:'OpenBSD', sunos:'Solaris', aix:'AIX' };
  var CPU_LABEL = { arm64:'ARM64', x64:'x64', ia32:'x86', arm:'ARM', ppc64:'PPC64', s390x:'s390x', mips:'MIPS', riscv64:'RISC-V' };
  var RING_R = 44;
  var RING_C = 2 * Math.PI * RING_R;

  function fmtBytes(n){
    if (n == null || !isFinite(n)) return '-';
    var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0, v = Number(n);
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    // 整数就不带小数, 避免 "8.0 GB" 这种观感
    var s = (i === 0 || v >= 100 || Number.isInteger(v)) ? String(Math.round(v)) : v.toFixed(1);
    return s + ' ' + u[i];
  }
  function fmtDur(sec){
    var s = Math.max(0, Math.floor(Number(sec) || 0));
    var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    if (d) return d + ' 天 ' + h + ' 小时';
    if (h) return h + ' 小时' + (m ? ' ' + m + ' 分' : '');
    if (m) return m + ' 分 ' + (s % 60) + ' 秒';
    return s + ' 秒';
  }
  function pctText(v){
    if (v == null || !isFinite(v)) return '—';
    return (Math.round(Number(v) * 10) / 10) + '%';
  }
  function meterCls(v){
    if (v == null || !isFinite(v)) return 'meter';
    return 'meter' + (Number(v) >= 85 ? ' hot' : (Number(v) >= 60 ? ' warm' : ''));
  }
  function meterHtml(id, v){
    var n = (v == null || !isFinite(v)) ? 0 : Math.max(0, Math.min(100, Number(v)));
    return '<div class="' + meterCls(v) + '"><i id="' + id + 'Bar" style="width:' + n + '%"></i></div>';
  }
  // 负载/占用率越高越"红", 环形和进度条共用一套阈值
  function toneColor(v){
    if (v == null || !isFinite(v)) return 'var(--primary)';
    var n = Number(v);
    if (n >= 85) return 'var(--error)';
    if (n >= 60) return '#e8a33d';
    return 'var(--primary)';
  }
  function dotInline(ok){
    return '<span class="dot-inline' + (ok ? ' on' : '') + '"></span>';
  }
  // 资源磁贴: 标签 + 大数字 + 细进度条 + 说明
  function tile(id, label, value, pct, sub){
    return '<div class="tile"><div class="t-label">' + esc(label) + '</div>' +
      '<div class="t-val" id="' + id + 'Val">' + esc(value) + '</div>' +
      (pct == null ? '' : meterHtml(id, pct)) +
      (sub ? '<div class="t-sub" id="' + id + 'Sub">' + esc(sub) + '</div>' : '') +
      '</div>';
  }
  // 运行环境用的键值块
  function defItem(label, value, id){
    return '<div class="def"><div class="d-label">' + esc(label) + '</div>' +
      '<div class="d-val"' + (id ? ' id="' + id + '"' : '') + '>' + esc(value) + '</div></div>';
  }

  function renderHome(d){
    var s = d.system || {};
    var p = d.process || {};
    var a = d.account || {};
    var initial = (a.userName || '?').slice(0, 1).toUpperCase();
    var cpu = (s.cpuPercent == null || !isFinite(s.cpuPercent)) ? null : Number(s.cpuPercent);
    var offset = RING_C * (1 - (cpu == null ? 0 : cpu) / 100);

    // 顶部: 账号 + 状态胶囊 + 系统 CPU 环形表
    var html = '<div class="hero home-hero">' +
      '<div class="hero-main">' +
      '<span class="avatar hero-avatar">' + esc(initial) + '</span>' +
      '<div class="hero-text"><div class="watch-name">' + esc(a.userName || '未登录') + '</div>' +
      '<div class="hero-pills">' +
      '<span class="pill">' + dotInline(a.loggedIn) + (a.loggedIn ? '已登录' : '未登录') + '</span>' +
      '<span class="pill">' + dotInline(a.imConnected) + 'IM ' + (a.imConnected ? '在线' : '未连接') + '</span>' +
      '<span class="pill">' + dotInline(a.onebotRunning) + 'OneBot ' + (a.onebotRunning ? '运行中' : '未运行') + '</span>' +
      (a.watchCount ? '<span class="pill">' + esc(a.watchCount) + ' 台手表</span>' : '') +
      '</div></div></div>' +
      '<div class="gauge" title="系统 CPU 占用">' +
      '<svg viewBox="0 0 100 100">' +
      '<circle class="g-bg" cx="50" cy="50" r="' + RING_R + '"/>' +
      '<circle class="g-fg" id="homeCpuRing" cx="50" cy="50" r="' + RING_R + '"' +
      ' stroke-dasharray="' + RING_C.toFixed(1) + '" stroke-dashoffset="' + offset.toFixed(1) + '"' +
      ' style="stroke:' + toneColor(cpu) + '"/>' +
      '</svg>' +
      '<div class="gauge-label"><b id="homeCpuBig">' + pctText(cpu) + '</b><span>系统 CPU</span></div>' +
      '</div></div>';

    // 公告(异步填充, 没公告或服务不可用时整块不显示)
    html += '<div id="homeNotice"></div>';

    // 每日一言(异步加载, 不阻塞仪表盘)
    html += '<div class="card quote-card">' +
      '<div class="quote-mark">”</div>' +
      '<div class="quote-text" id="quoteText">加载中…</div>' +
      '<div class="quote-meta"><span id="quoteFrom"></span>' +
      '<button class="btn small text" id="quoteNext">换一条</button></div></div>';

    html += '<div class="grid">';

    // 资源占用: 4 个磁贴
    html += '<div class="card"><div class="card-title">资源占用</div><div class="tiles">' +
      tile('homeSysMem', '系统内存', pctText(s.memPercent), s.memPercent,
        fmtBytes(s.memUsed) + ' / ' + fmtBytes(s.memTotal)) +
      tile('homeProcCpu', '本程序 CPU', pctText(p.cpuPercent), p.cpuPercent,
        '相对单核 · PID ' + (p.pid || '-')) +
      tile('homeProcMem', '本程序内存', fmtBytes(p.rss), s.memTotal ? (p.rss / s.memTotal * 100) : 0,
        '堆 ' + fmtBytes(p.heapUsed) + ' / ' + fmtBytes(p.heapTotal)) +
      tile('homeLoad', '系统负载', (s.loadavg || []).map(function(x){ return Number(x).toFixed(2); }).join(' / '), null,
        (s.cpuCores || 0) + ' 核') +
      '</div></div>';

    // 运行环境
    html += '<div class="card"><div class="card-title">运行环境</div><div class="defs">' +
      defItem('系统架构', (OS_LABEL[s.platform] || s.platform || '-') + ' · ' + (CPU_LABEL[s.arch] || s.arch || '-')) +
      defItem('内核版本', s.release || '-') +
      defItem('处理器', s.cpuModel || '-') +
      defItem('主机名', s.hostname || '-') +
      defItem('Node.js', (p.node || '-') + ' · ' + (CPU_LABEL[p.arch] || p.arch || '-')) +
      defItem('程序运行', fmtDur(p.uptime), 'homeProcUptime') +
      defItem('系统运行', fmtDur(s.uptime)) +
      '</div></div>';

    // 账号信息
    html += '<div class="card"><div class="card-title">账号信息</div>' +
      '<div class="row"><span>账号</span><span class="value">' + esc(a.userName || '-') + '</span></div>' +
      '<div class="row"><span>登录状态</span><span class="value">' + dotInline(a.loggedIn) + (a.loggedIn ? '已登录' : '未登录') + '</span></div>' +
      '<div class="row"><span>mobileId</span><span class="value">' + esc(a.mobileId || '-') + '</span></div>' +
      '<div class="row"><span>IM 长连接</span><span class="value">' + dotInline(a.imConnected) + (a.imConnected ? '已连接' : '未连接') + '</span></div>' +
      '<div class="row"><span>OneBot</span><span class="value">' + dotInline(a.onebotRunning) + (a.onebotRunning ? '运行中' : '未运行') + '</span></div>' +
      '<div class="row"><span>绑定手表</span><span class="value">' + (a.watchCount || 0) + ' 台</span></div>' +
      '</div>';

    // 手表列表(主页不做切换, 只做概览; 切换在顶部手表条里)
    var ws = a.watches || [];
    if (ws.length) {
      html += '<div class="card"><div class="card-title">手表</div><div class="list">' +
        ws.map(function(w){
          return '<div class="list-item"><div class="list-main">' +
            '<div class="list-title">' + dotInline(w.online) + esc(w.name) + '</div>' +
            '<div class="list-sub">' + esc(w.model || '-') + ' · ' + (w.online ? '在线' : '离线') + '</div></div>' +
            '<span class="battery-mini' + (w.battery != null && Number(w.battery) <= 20 ? ' low' : '') + '">' +
            (w.battery != null ? esc(w.battery) + '%' : '-') + '</span></div>';
        }).join('') + '</div></div>';
    }

    html += '</div>';
    $('#content').innerHTML = html;

    var nx = $('#quoteNext');
    if (nx) nx.onclick = function(){ loadQuote(true); };
    loadQuote(false);
    loadHomeNotices();

    // 3 秒刷新一次数字(只改文本和进度条, 不整页重绘, 避免闪烁)
    state.homePoll = setInterval(function(){
      if (state.tab !== 'home') return;
      updateHome();
    }, 3000);
  }

  async function updateHome(){
    var d;
    try { d = await api('/api/system'); } catch (e) { return; }
    var s = d.system || {}, p = d.process || {};
    function setText(id, text){
      var el = document.getElementById(id);
      if (el) el.textContent = text;
    }
    function paint(id, v){
      var b = document.getElementById(id + 'Bar');
      if (!b) return;
      var n = (v == null || !isFinite(v)) ? 0 : Math.max(0, Math.min(100, Number(v)));
      b.style.width = n + '%';
      if (b.parentNode) b.parentNode.className = meterCls(v);
    }
    // 环形表: 只改 dashoffset 和颜色
    var ring = document.getElementById('homeCpuRing');
    if (ring) {
      var cpu = (s.cpuPercent == null || !isFinite(s.cpuPercent)) ? null : Number(s.cpuPercent);
      var off = RING_C * (1 - (cpu == null ? 0 : cpu) / 100);
      ring.setAttribute('stroke-dashoffset', off.toFixed(1));
      ring.style.stroke = toneColor(cpu);
    }
    setText('homeCpuBig', pctText(s.cpuPercent));
    setText('homeSysMemVal', pctText(s.memPercent));
    setText('homeSysMemSub', fmtBytes(s.memUsed) + ' / ' + fmtBytes(s.memTotal));
    paint('homeSysMem', s.memPercent);
    setText('homeProcCpuVal', pctText(p.cpuPercent));
    setText('homeProcCpuSub', '相对单核 · PID ' + (p.pid || '-'));
    paint('homeProcCpu', p.cpuPercent);
    setText('homeProcMemVal', fmtBytes(p.rss));
    setText('homeProcMemSub', '堆 ' + fmtBytes(p.heapUsed) + ' / ' + fmtBytes(p.heapTotal));
    paint('homeProcMem', s.memTotal ? (p.rss / s.memTotal * 100) : 0);
    setText('homeLoadVal', (s.loadavg || []).map(function(x){ return Number(x).toFixed(2); }).join(' / '));
    setText('homeLoadSub', (s.cpuCores || 0) + ' 核');
    setText('homeProcUptime', fmtDur(p.uptime));
  }

  async function loadQuote(force){
    var t = $('#quoteText');
    if (t) t.textContent = force ? '换一条…' : '加载中…';
    try {
      var q = await api('/api/yiyan' + (force ? '?refresh=1' : ''));
      var txt = $('#quoteText');
      if (txt) txt.textContent = q.text || '（今天没有一言）';
      var src = [];
      if (q.author) src.push('—— ' + q.author);
      if (q.from) src.push('《' + String(q.from).replace(/^《|》$/g, '') + '》');
      if (q.upstream === 'local') src.push('· 离线词库');
      var f = $('#quoteFrom');
      if (f) f.textContent = src.join(' ');
    } catch (e) {
      var t2 = $('#quoteText');
      if (t2) t2.textContent = '一言加载失败：' + e.message;
    }
  }

  // ===== 功能宫格 =====
  var FEATURE_MODULES = {
    health: [[2642]],
    wifi: [[2513]],
    ai: [[3886]],
    apps: [[72, 3171]]
  };
  var FEATURE_GROUPS = [
    ['设备', ['overview', 'profile', 'health', 'wifi', 'apps', 'alarms']],
    ['通讯', ['friends', 'contacts']],
    ['安全与系统', ['guard', 'settings', 'hidden', 'ai', 'bind']]
  ];

  function moduleOk(caps, groups){
    var map = (caps && caps.modules) || {};
    return (groups || []).every(function(ids){
      var found = ids.map(function(id){ return map[id]; }).filter(function(x){ return x && x.display != null; });
      if (!found.length) return true;
      if (found.some(function(x){ return Number(x.display) === 0; })) return true;
      if (found.length < ids.length) return true;
      return false;
    });
  }

  function renderMore(caps){
    var w = currentWatch() || {};
    var map = {};
    FEATURES.forEach(function(f){ map[f[0]] = f; });
    var html = '<div class="more-layout"><div class="panels">';
    FEATURE_GROUPS.forEach(function(g){
      html += '<section class="panel"><h3>' + esc(g[0]) + '</h3><div class="entry-grid">';
      g[1].forEach(function(k){
        var f = map[k];
        if (!f) return;
        if (!moduleOk(caps, FEATURE_MODULES[k])) return;
        html += '<button class="entry" data-fn="' + f[0] + '"><i>' + esc(f[1].slice(0, 1)) +
          '</i><span>' + esc(f[1]) + '</span></button>';
      });
      html += '</div></section>';
    });
    html += '</div>';
    html += '<aside class="panel device-panel"><h3>当前设备</h3>' +
      '<div class="row"><span>手表</span><span class="value">' + esc(w.name || '未选择') + '</span></div>' +
      '<div class="row"><span>号码</span><span class="value">' + esc(w.number || '-') + '</span></div>' +
      '<div class="row"><span>型号</span><span class="value">' + esc(w.model || '-') + '</span></div>' +
      '<div class="row"><span>固件</span><span class="value">' + esc(w.firmware || '-') + '</span></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">' +
      '<button class="btn small tonal" id="moreBind">绑定手表</button>' +
      '<button class="btn small" id="moreAccount">账号设置</button></div></aside></div>';
    $('#content').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('[data-fn]'), function(btn){
      btn.onclick = function(){
        state.tab = btn.getAttribute('data-fn');
        renderNav(); updateTitle(); load();
      };
    });
    var b = $('#moreBind');
    if (b) b.onclick = function(){ state.tab = 'bind'; renderNav(); updateTitle(); load(); };
    var a = $('#moreAccount');
    if (a) a.onclick = function(){ state.tab = 'account'; renderNav(); updateTitle(); load(); };
  }

  // ===== 我的 =====
  // ===== OneBot v11 接入信息 =====
  function copyText(s, btn){
    var done = function(){ var t = btn.textContent; btn.textContent = '已复制'; setTimeout(function(){ btn.textContent = t; }, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(done, function(){ toast('复制失败，请手动选中', true); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = s;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch(e){ toast('复制失败', true); }
      document.body.removeChild(ta);
    }
  }

  // OneBot 接入卡片: 只显示「当前手表」那一套。左上角切换手表后 load() 会重新渲染,
  // 卡片自动跟着切过去 —— 没有全局实例了, 每块表各有自己的端口/令牌/会话范围。
  // 设置分组展开状态(按标题记, null 表示还没手动点过, 用默认值)
  var obSecOpen = null;

  async function loadOneBotCard(){
    var box = $('#onebotCard');
    if (!box) return;
    var ob;
    try { ob = await api('/api/onebot'); } catch(e){ box.innerHTML = ''; return; }

    var wid = String(state.id || '');
    var cw = currentWatch() || {};
    if (!wid) {
      box.innerHTML = '<div class="card"><div class="card-title">OneBot v11 接入</div>' +
        '<div class="muted" style="font-size:12.5px">还没有手表。先在「我的 → 绑定手表」里绑一块，再回来配置。</div></div>';
      return;
    }
    var list = ob.watches || [];
    var w = null;
    for (var i = 0; i < list.length; i++) if (String(list[i].watchId) === wid) { w = list[i]; break; }
    if (!w) {
      w = { watchId: wid, name: cw.name || wid, enabled: false, running: false, clients: 0,
            keys: [], auto: true, http: {}, ws: {}, wsClient: {}, configured: false };
    }

    var host = location.hostname || '127.0.0.1';
    var hb = ob.heartbeat != null ? ob.heartbeat : 30;
    var httpC = w.http || {}, wsC = w.ws || {}, rc = w.wsClient || {};
    var tgts = ob.targets || [];
    var keys = w.keys || [];
    var wname = w.name || cw.name || wid;

    var sw = function(id, on){
      return '<label class="switch"><input id="' + id + '" type="checkbox"' + (on ? ' checked' : '') + '><span></span></label>';
    };
    var row = function(label, val){
      return '<div class="row"><span>' + label + '</span><span class="value" style="display:flex;align-items:center;gap:6px;min-width:0">' +
        '<code style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(val) + '</code>' +
        '<button class="btn small tonal js-copy" data-copy="' + esc(val) + '">复制</button></span></div>';
    };
    var stat = w.running ? '<span style="color:var(--success)">运行中</span>'
      : (w.enabled ? '<span style="color:var(--danger,#d9534f)">未运行</span>' : '已关闭');

    var html = '<div class="card"><div class="card-title" style="display:flex;align-items:center;justify-content:space-between;gap:10px">' +
      '<span>OneBot v11 接入</span>' +
      '<button class="btn small tonal" id="obEdit">设置</button></div>' +
      '<div class="row"><span>当前手表<span class="muted" style="font-size:11px"> · 左上角切换</span></span><span class="value">' + esc(wname) + '</span></div>' +
      '<div class="row"><span>状态</span><span class="value">' + stat +
        (w.clients ? ' · ' + w.clients + ' 个客户端' : '') + '</span></div>';

    if (w.enabled) {
      html += '<div class="row"><span>self_id</span><span class="value">' + esc(String(ob.selfId || '-')) + '</span></div>';
      if (httpC.enabled) {
        html += row('HTTP API' + (httpC.running ? '' : '（未监听）'), 'http://' + host + ':' + (httpC.port || ''));
        html += row('HTTP 令牌', httpC.token || '-');
      }
      if (wsC.enabled) {
        html += row('WS 地址' + (wsC.running ? '' : '（未监听）'), 'ws://' + host + ':' + (wsC.port || ''));
        html += row('WS 令牌', wsC.token || '-');
      }
      if (rc.enabled) {
        var stTxt = rc.connected ? '<span style="color:var(--success)">已连接</span>'
          : (rc.state === 'connecting' ? '连接中' : '未连接/重连中');
        html += '<div class="row"><span>反向 WS</span><span class="value" style="display:flex;align-items:center;gap:6px;min-width:0">' +
          '<code style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(rc.url || '-') + '</code>' +
          '<span class="muted" style="font-size:12px;flex:none">' + stTxt + '</span></span></div>';
      }
      html += '<div class="row"><span>会话范围</span><span class="value" style="font-size:12px;text-align:right">' +
        (w.auto ? '自动匹配' : '手动指定') + ' → ' +
        (keys.length ? esc(keys.join('、')) : '<span class="muted">没匹配到，暂时接收全部会话</span>') + '</span></div>';
      html += '<div class="muted" style="font-size:12px;line-height:1.65;margin-top:10px">' +
        '在 AstrBot / NoneBot 里选 OneBot v11（aiocqhttp），填上面的 WS 地址，令牌填 access_token。' +
        '这个实例只收发「' + esc(wname) + '」的会话，别的表不会串进来。</div>';
    } else {
      html += '<div class="muted" style="font-size:12.5px">这块表的接入还没启用。点右上角「设置」打开开关并保存，' +
        '就会单独为它起一套端口和令牌。</div>';
    }

    // ===== 设置表单(默认收起), 内部分组折叠 =====
    // 折叠用纯 JS 切 .open, 不依赖 <details> 的默认行为(summary 改 display 后部分浏览器会失灵)
    var sec = function(title, sub, body, open){
      var isOpen = obSecOpen ? !!obSecOpen[title] : !!open;
      return '<div class="ob-sec' + (isOpen ? ' open' : '') + '" data-sec="' + esc(title) + '">' +
        '<button type="button" class="ob-sec-head" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
          '<span>' + title +
            (sub ? '<span class="ob-sec-sub"> · ' + esc(sub) + '</span>' : '') +
          '</span>' +
          '<i class="ob-sec-arrow" aria-hidden="true"></i>' +
        '</button>' +
        '<div class="ob-sec-body">' + body + '</div></div>';
    };

    var opts = tgts.map(function(t){
      var label = (t.type === 'group' ? '家庭群 · ' : '单聊 · ') + (t.name || t.key) + '（' + t.key + '）';
      return '<option value="' + esc(t.key) + '"' + (keys.indexOf(t.key) >= 0 ? ' selected' : '') + '>' + esc(label) + '</option>';
    }).join('');

    var secWatch =
      '<div class="row"><span>启用这块表</span>' + sw('obwOn', w.enabled) + '</div>' +
      '<div class="ob-w-grid">' +
        '<label class="field" style="margin-bottom:0"><span>HTTP 端口</span>' +
          '<input id="obwHp" type="number" min="1" max="65535" value="' + esc(httpC.port ? String(httpC.port) : '') + '" placeholder="留空自动分配"></label>' +
        '<label class="field" style="margin-bottom:0"><span>WS 端口</span>' +
          '<input id="obwWp" type="number" min="1" max="65535" value="' + esc(wsC.port ? String(wsC.port) : '') + '" placeholder="留空自动分配"></label>' +
      '</div>' +
      '<label class="field" style="margin:10px 0 0"><span>只收这些会话（一个都不选 = 按手表自动匹配）</span>' +
        '<select id="obwKeys" multiple size="' + Math.min(6, Math.max(2, tgts.length)) + '">' + opts + '</select></label>' +
      '<div class="row" style="margin-top:10px"><span>反向 WS</span>' + sw('obwRevOn', !!rc.enabled) + '</div>' +
      '<div class="muted" style="font-size:12px;line-height:1.6;margin:8px 0 10px">由本程序主动连到对方，适合 AstrBot 跑在别的机器或公网。' +
        '启用后 HTTP / 正向 WS 可以全部关掉，这块表就不监听任何端口。</div>' +
      '<label class="field"><span>地址</span><input id="obwRevUrl" value="' + esc(rc.url || '') + '" placeholder="ws://127.0.0.1:6199/ws"></label>' +
      '<label class="field"><span>令牌</span><input id="obwRevToken" value="' + esc(rc.token || '') + '" placeholder="对方设置的 access_token"></label>' +
      '<label class="field"><span>重连间隔（秒）</span><input id="obwRevReconnect" type="number" min="1" max="3600" value="' + esc(String(rc.reconnect || 5)) + '"></label>' +
      '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
        '<button class="btn small" id="obwSave">保存</button>' +
        '<button class="btn small tonal" id="obwHr">重置 HTTP 令牌</button>' +
        '<button class="btn small tonal" id="obwWr">重置 WS 令牌</button></div>';

    var secBase =
      '<div class="row"><span>QQ 兼容模式</span>' + sw('obQqCompat', ob.qqCompat !== false) + '</div>' +
      '<div class="muted" style="font-size:12px;line-height:1.6;margin:6px 0 10px">' +
        '开启后，微聊做不到的动作（撤回、禁言、戳一戳、群文件等）会静默返回成功，' +
        '按 QQ 写的插件不会因为一个报错整条链路崩掉。关掉则严格报错，便于排查。</div>' +
      '<label class="field" style="margin-top:10px"><span>心跳间隔（秒，0 表示不发心跳）</span>' +
        '<input id="obHeartbeat" type="number" min="0" max="600" value="' + esc(String(hb)) + '"></label>' +
      '<div class="muted" style="font-size:12px;line-height:1.6;margin-bottom:10px">这两项是所有手表共用的，改一次全部生效。</div>' +
      '<button class="btn small" id="obBaseSave">保存通用设置</button>';

    html += '<div id="obForm" class="hidden" style="border-top:1px solid var(--outline-variant);margin-top:14px;padding-top:14px">' +
      sec('本表设置 · ' + wname, (w.enabled ? '已启用' : '已关闭') + ' · :' + (httpC.port || '自动'), secWatch, true) +
      sec('通用设置', '心跳 ' + hb + 's · QQ 兼容' + (ob.qqCompat !== false ? '开' : '关'), secBase, false) +
      '<div style="display:flex;gap:8px;margin-top:14px">' +
        '<button class="btn tonal" id="obCancel">收起</button></div>' +
      '</div>';

    html += '</div>';
    box.innerHTML = html;

    box.querySelectorAll('.js-copy').forEach(function(b){
      b.onclick = function(){ copyText(b.getAttribute('data-copy'), b); };
    });

    // 分组折叠: 点标题切 .open; 展开状态记在 obSecOpen 里, 重新渲染后仍保留
    box.querySelectorAll('.ob-sec-head').forEach(function(head){
      head.addEventListener('click', function(){
        var sec2 = head.parentNode;
        if (!sec2) return;
        var on = !sec2.classList.contains('open');
        sec2.classList.toggle('open', on);
        head.setAttribute('aria-expanded', on ? 'true' : 'false');
        obSecOpen = obSecOpen || {};
        obSecOpen[sec2.getAttribute('data-sec')] = on;
      });
    });

    var form = $('#obForm');
    var editBtn = $('#obEdit');
    if (editBtn) editBtn.onclick = function(){
      form.classList.toggle('hidden');
      editBtn.textContent = form.classList.contains('hidden') ? '设置' : '收起';
    };
    if ($('#obCancel')) $('#obCancel').onclick = function(){
      form.classList.add('hidden');
      if (editBtn) editBtn.textContent = '设置';
    };

    var resetTok = function(which, btn){
      btn.disabled = true;
      var old = btn.textContent;
      btn.textContent = '重置中…';
      api('/api/onebot/watch/token', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ watchId: wid, which: which }),
      }).then(function(){
        toast('令牌已重置，旧令牌立即失效');
        return loadOneBotCard();
      }).catch(function(e){
        toast(e.message || '重置失败', true);
        btn.disabled = false; btn.textContent = old;
      });
    };
    if ($('#obwHr')) $('#obwHr').onclick = function(){ resetTok('http', this); };
    if ($('#obwWr')) $('#obwWr').onclick = function(){ resetTok('ws', this); };

    if ($('#obwSave')) $('#obwSave').onclick = async function(){
      var btn = this;
      var sel = $('#obwKeys');
      var picked = [];
      if (sel) Array.prototype.forEach.call(sel.options, function(o){ if (o.selected) picked.push(o.value); });
      var payload = {
        watchId: wid,
        enabled: $('#obwOn').checked,
        http: { port: Number($('#obwHp').value) || 0 },
        ws: { port: Number($('#obwWp').value) || 0 },
        wsClient: {
          enabled: $('#obwRevOn').checked,
          url: $('#obwRevUrl').value.trim(),
          token: $('#obwRevToken').value.trim(),
          reconnect: Number($('#obwRevReconnect').value),
        },
        targets: picked,
      };
      btn.disabled = true;
      btn.textContent = '保存中…';
      try {
        var st = await api('/api/onebot/watch', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
        });
        var bad = (st.watches || []).filter(function(x){ return String(x.watchId) === wid && x.enabled && !x.running; });
        toast(bad.length ? '已保存，但这个实例没起来（端口可能被占用）' : '已保存并重启', bad.length > 0);
        await loadOneBotCard();
      } catch(e){
        toast(e.message || '保存失败', true);
        btn.disabled = false;
        btn.textContent = '保存';
      }
    };

    if ($('#obBaseSave')) $('#obBaseSave').onclick = async function(){
      var btn = this;
      btn.disabled = true;
      btn.textContent = '保存中…';
      try {
        await api('/api/onebot/config', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ heartbeat: Number($('#obHeartbeat').value), qqCompat: $('#obQqCompat').checked }),
        });
        toast('通用设置已保存');
        await loadOneBotCard();
      } catch(e){
        toast(e.message || '保存失败', true);
        btn.disabled = false;
        btn.textContent = '保存通用设置';
      }
    };
  }

  // 对外 API 卡片: 只显示「当前手表」那一个令牌。令牌即身份, 只能操作这块表
  async function loadGeniusApiCard(){
    var box = $('#geniusApiCard');
    if (!box) return;
    var wid = String(state.id || '');
    var cw = currentWatch() || {};
    if (!wid) { box.innerHTML = ''; return; }
    var st;
    try { st = await api('/api/genius-api'); } catch(e){ box.innerHTML = ''; return; }

    var list = st.watches || [];
    var w = null;
    for (var i = 0; i < list.length; i++) if (String(list[i].watchId) === wid) { w = list[i]; break; }
    if (!w) w = { watchId: wid, name: cw.name || wid, enabled: false, token: '' };
    var wname = w.name || cw.name || wid;
    var on = !!w.enabled;
    var token = w.token || '';
    var base = location.origin + '/api/ext';
    var q = '?token=' + encodeURIComponent(token);

    var row = function(label, val){
      return '<div class="row"><span>' + label + '</span><span class="value" style="display:flex;align-items:center;gap:6px;min-width:0">' +
        '<code style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(val) + '</code>' +
        '<button class="btn small tonal js-copy" data-copy="' + esc(val) + '">复制</button></span></div>';
    };

    var html = '<div class="card"><div class="card-title">对外 API</div>' +
      '<div class="row"><span>当前手表<span class="muted" style="font-size:11px"> · 左上角切换</span></span><span class="value">' + esc(wname) + '</span></div>' +
      '<div class="row"><span>状态</span><span class="value">' +
        (on ? '<span style="color:var(--success)">已启用</span>' : '未启用') + '</span></div>';
    if (on && token) {
      html += row('令牌', token);
      html += row('好友列表', base + '/friends' + q);
      html += row('加好友口令', base + '/genius' + q);
    }
    html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">' +
      '<button class="btn small ' + (on ? 'danger' : '') + '" id="gaToggle">' +
        (on ? '关闭这块表的接口' : '为这块表启用') + '</button>' +
      (on ? '<button class="btn small tonal" id="gaReset">重置令牌</button>' : '') +
      '</div>';

    html += '<div class="muted" style="font-size:12px;line-height:1.75;margin-top:12px">' +
      '给第三方脚本 / 机器人用，走自己的令牌，不需要 WebUI 访问令牌。' +
      '一个令牌只对应一块手表，<code>watchId</code> 传别的手表会被拒绝（403）。四个接口共用这一个令牌：<br>' +
      '<code>GET /api/ext/friends</code> 好友列表<br>' +
      '<code>GET /api/ext/friends/&lt;好友id&gt;</code> 好友详情（id 也可用 friendId / IM 账号 / 号码）<br>' +
      '<code>DELETE /api/ext/friends/&lt;好友id&gt;?confirm=&lt;好友id&gt;</code> 删除好友<br>' +
      '<code>GET /api/ext/genius</code> 加好友口令<br>' +
      '切换手表后这一栏会跟着切到那块表的令牌。删除是破坏性操作，' +
      '<code>confirm</code> 必须和好友记录 id 完全一致，否则返回 400。' +
      '</div></div>';
    box.innerHTML = html;

    box.querySelectorAll('.js-copy').forEach(function(b){
      b.onclick = function(){ copyText(b.getAttribute('data-copy'), b); };
    });

    if ($('#gaToggle')) $('#gaToggle').onclick = async function(){
      var btn = this;
      btn.disabled = true;
      try {
        await api('/api/genius-api/config', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ watchId: wid, enabled: !on }),
        });
        toast(on ? '已关闭这块表的接口' : '已启用，令牌已生成');
        await loadGeniusApiCard();
      } catch(e){
        toast(e.message || '操作失败', true);
        btn.disabled = false;
      }
    };

    if ($('#gaReset')) $('#gaReset').onclick = async function(){
      var btn = this;
      btn.disabled = true;
      btn.textContent = '重置中…';
      try {
        await api('/api/genius-api/token', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ watchId: wid }),
        });
        toast('令牌已重置，旧令牌立即失效');
        await loadGeniusApiCard();
      } catch(e){
        toast(e.message || '重置失败', true);
        btn.disabled = false;
        btn.textContent = '重置令牌';
      }
    };
  }

  // ===== 实时日志 =====
  // 主通道是 SSE(/api/logs/stream), 拿不到数据就退化成 1.5 秒轮询。
  // 只保留最近 LOG_MAX 行 DOM, 否则页面开一晚上会越来越卡。
  var LOG_MAX = 600;
  var logES = null;          // EventSource
  var logPollTimer = null;   // 轮询兜底
  var logSeq = 0;            // 已收到的最新 seq, 轮询时当游标
  var logPaused = false;
  var logAutoScroll = true;

  function logTagName(e){
    var t = String(e.tag || '');
    if (t === 'HTTP' || t === 'API') return t;
    return ({ 10:'DEBUG', 20:'INFO', 30:'WARN', 40:'ERROR' })[e.sev] || 'INFO';
  }
  function logTagClass(e){
    var t = String(e.tag || '');
    if (t === 'HTTP') return 'lg-http';
    if (t === 'API') return 'lg-api';
    if (e.sev >= 40) return 'lg-error';
    if (e.sev >= 30) return 'lg-warn';
    if (e.sev >= 20) return 'lg-info';
    return 'lg-debug';
  }
  function logLineHtml(e){
    var d = new Date(e.t);
    var p = function(x){ return String(x).padStart(2, '0'); };
    var tm = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '.' +
      String(d.getMilliseconds()).padStart(3, '0');
    var cls = logTagClass(e);
    return '<div class="log-line ' + cls + '">' +
      '<span class="log-t">' + tm + '</span>' +
      '<span class="log-tag ' + cls + '">' + esc(logTagName(e)) + '</span>' +
      (e.cat ? '<span class="log-cat">' + esc(e.cat) + '</span>' : '') +
      '<span class="log-msg">' + esc(e.text) + '</span></div>';
  }
  function logSetCount(n){
    var c = $('#logCount');
    if (c) c.textContent = (n == null ? 0 : n) + ' 行';
  }
  function logTrim(){
    var body = $('#logBody');
    if (!body) return 0;
    var extra = body.childElementCount - LOG_MAX;
    for (var i = 0; i < extra; i++) body.removeChild(body.firstChild);
    return body.childElementCount;
  }
  function logAppend(entries){
    var body = $('#logBody');
    if (!body || !entries || !entries.length) return;
    // 用户往上翻看历史时别把他拽回底部
    var atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 48;
    body.insertAdjacentHTML('beforeend', entries.map(logLineHtml).join(''));
    logSetCount(logTrim());
    if (logAutoScroll && atBottom) body.scrollTop = body.scrollHeight;
    var last = entries[entries.length - 1];
    if (last && last.seq > logSeq) logSeq = last.seq;
  }
  function logReset(entries, seq){
    var body = $('#logBody');
    if (!body) return;
    body.innerHTML = (entries || []).map(logLineHtml).join('');
    logSetCount(logTrim());
    body.scrollTop = body.scrollHeight;
    if (typeof seq === 'number' && seq >= 0) logSeq = seq;
    else if (entries && entries.length) logSeq = entries[entries.length - 1].seq;
  }

  function stopLogStream(){
    if (logES) { try { logES.close(); } catch(e){} logES = null; }
    if (logPollTimer) { clearInterval(logPollTimer); logPollTimer = null; }
  }

  function startLogPoll(){
    if (logPollTimer) return;
    logPollTimer = setInterval(async function(){
      if (state.tab !== 'logs' || logPaused) return;
      try {
        var d = await api('/api/logs?limit=200&since=' + logSeq);
        if (d && d.entries && d.entries.length) logAppend(d.entries);
      } catch(e){ /* 下一轮再试 */ }
    }, 1500);
  }

  function startLogStream(){
    stopLogStream();
    if (!window.EventSource) { startLogPoll(); return; }
    var got = false;
    try { logES = new EventSource('/api/logs/stream'); }
    catch(e){ logES = null; startLogPoll(); return; }

    logES.addEventListener('init', function(ev){
      got = true;
      var d = null;
      try { d = JSON.parse(ev.data); } catch(e){ return; }
      // 暂停时不要动 DOM: 用户正盯着某一段, 重连(或首连)刷历史会把它冲掉
      if (!logPaused) logReset(d.entries || [], d.seq || 0);
      else if (typeof d.seq === 'number') logSeq = d.seq;
      var sel = $('#logLevel');
      if (sel && d.level) sel.value = d.level;
    });
    logES.onmessage = function(ev){
      got = true;
      if (logPaused) return;
      var e = null;
      try { e = JSON.parse(ev.data); } catch(err){ return; }
      logAppend([e]);
    };
    // 一条数据都没收到就报错 = SSE 不通(多半是反代把 event-stream 缓冲了), 换轮询
    logES.onerror = function(){
      if (!got) { stopLogStream(); startLogPoll(); }
    };
    setTimeout(function(){
      if (!got && state.tab === 'logs') { stopLogStream(); startLogPoll(); }
    }, 3000);
  }

  async function renderLogs(){
    var d = null;
    try { d = await api('/api/logs?limit=300'); }
    catch(e){
      if (state.tab !== 'logs') return;
      $('#content').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
      return;
    }
    // 取数期间已经切走了就别再动 DOM, 也别起流
    if (state.tab !== 'logs') return;
    var levels = (d && d.levels) || ['debug', 'info', 'warn', 'error', 'silent'];
    var cur = (d && d.level) || 'info';

    var html = '<div class="log-toolbar">' +
      '<select id="logLevel" title="日志级别">' + levels.map(function(l){
        return '<option value="' + esc(l) + '"' + (l === cur ? ' selected' : '') + '>' + esc(l.toUpperCase()) + '</option>';
      }).join('') + '</select>' +
      '<label class="log-auto"><input type="checkbox" id="logAuto"' + (logAutoScroll ? ' checked' : '') + '> 自动滚动</label>' +
      '<button class="btn small tonal" id="logPause">' + (logPaused ? '继续' : '暂停') + '</button>' +
      '<button class="btn small tonal" id="logClear">清空</button>' +
      '<button class="btn small text" id="logCopy">复制</button>' +
      '<span class="muted" id="logCount" style="margin-left:auto;font-size:12px">0 行</span>' +
      '</div>' +
      '<div class="log-body" id="logBody"></div>' +
      '<div class="muted" style="font-size:12px;line-height:1.7;margin-top:8px">' +
        '实时推送，页面最多保留 600 行。要看到接口明细得把级别调到 DEBUG；调到 SILENT 会停止输出。' +
        '手机号等敏感信息在服务端已脱敏，复制出来也不会带原文。</div>';
    $('#content').innerHTML = html;
    logReset((d && d.entries) || [], (d && d.seq) || 0);

    var sel = $('#logLevel');
    if (sel) sel.onchange = async function(){
      try {
        var r = await api('/api/logs/level', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ level: sel.value }),
        });
        toast('日志级别已切换为 ' + String((r && r.level) || sel.value).toUpperCase());
      } catch(e){
        toast(e.message || '切换失败', true);
        sel.value = cur;
      }
    };
    var auto = $('#logAuto');
    if (auto) auto.onchange = function(){
      logAutoScroll = auto.checked;
      if (logAutoScroll) { var b = $('#logBody'); if (b) b.scrollTop = b.scrollHeight; }
    };
    var pb = $('#logPause');
    if (pb) pb.onclick = function(){
      logPaused = !logPaused;
      pb.textContent = logPaused ? '继续' : '暂停';
      if (!logPaused) {
        // 暂停期间的消息没进 DOM, 继续时直接按最近 300 条重刷
        api('/api/logs?limit=300').then(function(x){ logReset(x.entries || [], x.seq || 0); }).catch(function(){});
      }
    };
    var cb = $('#logClear');
    if (cb) cb.onclick = async function(){
      try {
        var r = await api('/api/logs', { method: 'DELETE' });
        logReset([], (r && typeof r.seq === 'number') ? r.seq : logSeq);
        toast('已清空');
      } catch(e){ toast(e.message || '清空失败', true); }
    };
    var cp = $('#logCopy');
    if (cp) cp.onclick = function(){
      var body = $('#logBody');
      var txt = body ? Array.prototype.map.call(body.children, function(el){ return el.textContent; }).join('\n') : '';
      if (!txt) { toast('没有内容可复制', true); return; }
      copyText(txt, cp);
    };

    startLogStream();
  }

  function initTileMap(lat, lng){
    var canvas = $('#mapCanvas');
    if (!canvas) return;
    canvas.innerHTML = '';
    var m = { lat: lat, lng: lng, zoom: 16, canvas: canvas, imgs: {}, dragging: null };

    function tileXY(lng2, lat2, z){
      var n = Math.pow(2, z);
      var x = (lng2 + 180) / 360 * n;
      var rad = lat2 * Math.PI / 180;
      var y = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n;
      return { x: x, y: y };
    }
    function tile2lng(x, z){ return x / Math.pow(2, z) * 360 - 180; }
    function tile2lat(y, z){
      var n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
      return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    }

    var renderTries = 0;
    function render(){
      var w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) {
        if (renderTries++ < 20) setTimeout(render, 150);
        return;
      }
      renderTries = 0;
      var n = Math.pow(2, m.zoom);
      var t = tileXY(m.lng, m.lat, m.zoom);
      var cx = t.x * 256, cy = t.y * 256;
      var x0 = Math.floor((cx - w / 2) / 256);
      var x1 = Math.floor((cx + w / 2) / 256);
      var y0 = Math.floor((cy - h / 2) / 256);
      var y1 = Math.floor((cy + h / 2) / 256);
      var used = {};
      for (var x = x0; x <= x1; x++) {
        for (var y = y0; y <= y1; y++) {
          if (y < 0 || y >= n) continue;
          var wx = ((x % n) + n) % n;
          var id = m.zoom + '_' + wx + '_' + y;
          used[id] = true;
          var img = m.imgs[id];
          if (!img) {
            img = document.createElement('img');
            img.src = 'https://webrd0' + ((wx + y) % 4 + 1) + '.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=' + wx + '&y=' + y + '&z=' + m.zoom;
            canvas.appendChild(img);
            m.imgs[id] = img;
          }
          img.style.left = Math.round(x * 256 - cx + w / 2) + 'px';
          img.style.top = Math.round(y * 256 - cy + h / 2) + 'px';
        }
      }
      Object.keys(m.imgs).forEach(function(id){
        if (!used[id]) {
          if (m.imgs[id].parentNode) m.imgs[id].parentNode.removeChild(m.imgs[id]);
          delete m.imgs[id];
        }
      });
      var pin = $('#mapPin');
      if (pin) { pin.style.display = 'block'; pin.style.left = (w / 2) + 'px'; pin.style.top = (h / 2) + 'px'; }
    }

    canvas.addEventListener('pointerdown', function(e){
      m.dragging = { x: e.clientX, y: e.clientY, lng: m.lng, lat: m.lat };
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });
    canvas.addEventListener('pointermove', function(e){
      if (!m.dragging) return;
      var n = Math.pow(2, m.zoom);
      var t = tileXY(m.dragging.lng, m.dragging.lat, m.zoom);
      m.lng = tile2lng(t.x - (e.clientX - m.dragging.x) / 256, m.zoom);
      m.lat = tile2lat(t.y - (e.clientY - m.dragging.y) / 256, m.zoom);
      render();
    });
    function stopDrag(){ m.dragging = null; }
    canvas.addEventListener('pointerup', stopDrag);
    canvas.addEventListener('pointercancel', stopDrag);

    var zin = $('#zoomIn'), zout = $('#zoomOut'), center = $('#mapCenter');
    if (zin) zin.onclick = function(){ m.zoom = Math.min(19, m.zoom + 1); m.imgs = {}; canvas.innerHTML = ''; render(); };
    if (zout) zout.onclick = function(){ m.zoom = Math.max(3, m.zoom - 1); m.imgs = {}; canvas.innerHTML = ''; render(); };
    if (center) center.onclick = function(){ m.lat = lat; m.lng = lng; m.zoom = 16; m.imgs = {}; canvas.innerHTML = ''; render(); };

    m.onResize = function(){ render(); };
    window.addEventListener('resize', m.onResize);
    m.destroy = function(){ window.removeEventListener('resize', m.onResize); };
    state.map = m;
    render();
  }

        var box = $('#messages');
        if (!box) return;

          var body;

            body = '<video class="media" src="' + esc(m.url) + '" controls preload="metadata"></video>';

            body = '<audio class="media" src="' + esc(m.url) + '" controls preload="metadata"></audio>' +
              '<div class="media-note">' + esc(m.text) + '</div>';

            '<span class="time">' + fmtTime(m.time) + '</span></div>';
        }).join('') || '<div class="empty">暂无消息，发送一条试试</div>';

    var plus = $('#chatPlus');
    if (plus) plus.onclick = function(){
      openInfo('发送内容',
        '<div class="fn-grid" style="border:none;padding:0;grid-template-columns:repeat(4,1fr);gap:14px 6px">' +
        '<button class="fn" id="mEmoji"><span class="fn-icon">表</span><span>表情</span></button>' +
        '<button class="fn" id="mKao"><span class="fn-icon">字</span><span>颜文字</span></button>' +
        '<button class="fn" id="mVoice"><span class="fn-icon">音</span><span>录音</span></button>' +
        '<button class="fn" id="mLoc"><span class="fn-icon">位</span><span>位置</span></button>' +

  // ===== 从相册选择图片/视频发送 =====
  function pickAndSend(kind, targetKey){
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = kind === 'video' ? 'video/*' : 'image/*';
    input.onchange = async function(){
      var f = input.files && input.files[0];
      if (!f) return;
      if (f.size > 100 * 1024 * 1024) { toast('文件超过 100MB', true); return; }
      toast('正在上传' + (kind === 'video' ? '视频' : '图片') + '...');
      try {
        var r = await fetch('/api/chats/media?key=' + encodeURIComponent(targetKey) +
          '&kind=' + kind + '&filename=' + encodeURIComponent(f.name), {
          method: 'POST',
          headers: { 'Content-Type': f.type || 'application/octet-stream' },
          body: f,
        });
        var j = await r.json();
        if (!j.ok) throw new Error(j.error || '上传失败');
        toast(kind === 'video' ? '视频已发送' : '图片已发送');
        load();
      } catch (e) { toast(e.message, true); }
    };
    input.click();
  }

  // ===== 录音发送 =====
  function openRecorder(targetKey){
    openInfo('录制语音',
      '<div style="text-align:center;padding:6px 0">' +
      '<button class="btn" id="recToggle">开始录音</button>' +
      '<div class="muted" id="recTime" style="margin-top:10px">00:00</div>' +
      '<p class="muted">录音会转码后发送到当前会话</p></div>');
    var btn = $('#recToggle');
    var timeEl = $('#recTime');
    var recorder = null;
    var stream = null;
    var chunks = [];
    var started = 0;
    var timer = null;

    function cleanup(){
      if (stream) { stream.getTracks().forEach(function(x){ x.stop(); }); stream = null; }
      if (timer) { clearInterval(timer); timer = null; }
    }

    btn.onclick = async function(){
      if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        toast('无法访问麦克风: ' + e.message, true);
        return;
      }
      chunks = [];
      started = Date.now();
      var mime = '';
      if (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime = 'audio/webm;codecs=opus';
      else if (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';
      try {
        recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      } catch (e) {
        cleanup();
        toast('当前浏览器不支持录音: ' + e.message, true);
        return;
      }
      recorder.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = async function(){
        var dur = Math.max(1, Math.round((Date.now() - started) / 1000));
        cleanup();
        var blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        if (blob.size < 400) { toast('录音太短', true); btn.textContent = '开始录音'; return; }
        btn.disabled = true;
        btn.textContent = '发送中...';
        try {
          var ab = await blob.arrayBuffer();
          var bytes = new Uint8Array(ab);
          var bin = '';
          for (var i = 0; i < bytes.length; i += 0x8000) {
            bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
          }
          await api('/api/chats/voice', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ key: targetKey, mime: recorder.mimeType, duration: dur, data: btoa(bin) })
          });
          closeModal();
          toast('语音已发送');
          load();
        } catch (e) {
          toast(e.message, true);
          btn.disabled = false;
          btn.textContent = '开始录音';
        }
      };
      recorder.start();
      btn.textContent = '停止并发送';
      timer = setInterval(function(){
        var s = Math.floor((Date.now() - started) / 1000);
        timeEl.textContent = ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + (s % 60)).slice(-2);
      }, 250);
    };
  }

  // 型号能力: 0=支持 1=不支持 2=可见但不可用; 无下发记录时按未知处理(放行)
  function capInfo(d, ids){
    var map = (d && d.capabilities) || {};
    var list = Array.isArray(ids) ? ids : [ids];
    var found = list.map(function(id){ return map[id]; }).filter(function(x){ return !!x && x.display != null; });
    if (!found.length) return { state:'unknown', ok:true, tips:'' };
    if (found.some(function(x){ return Number(x.display) === 0; })) return { state:'on', ok:true, tips:'' };
    if (found.length < list.length) return { state:'unknown', ok:true, tips:'' };
    var tips = '';
    found.forEach(function(x){ if (!tips && x.tips) tips = x.tips; });
    return { state: found.some(function(x){ return Number(x.display) === 2; }) ? 'useless' : 'off', ok:false, tips:tips };
  }

  function weekLabel(mask){
    var n = Number(mask);
    if (!n && n !== 0) return '';
    if (n === 127) return '每天';
    if (n === 31) return '周一至周五';
    if (n === 96) return '周末';
    var names = ['一','二','三','四','五','六','日'];
    var out = [];
    for (var i = 0; i < 7; i++) { if (n & (1 << i)) out.push('周' + names[i]); }
    return out.length ? out.join('、') : '未设置';
  }

  // 自定义背景: 支持图片 URL 与上传的 data URL
  function applyBg(bg){
    var el = document.body;
    if (bg) {
      el.style.backgroundImage = 'url("' + String(bg).replace(/"/g, '%22') + '")';
      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center center';
      el.style.backgroundRepeat = 'no-repeat';
      el.style.backgroundAttachment = 'fixed';
    } else {
      el.style.backgroundImage = '';
      el.style.backgroundSize = '';
      el.style.backgroundPosition = '';
      el.style.backgroundRepeat = '';
      el.style.backgroundAttachment = '';
    }
  }
  async function loadBackground(){
    try {
      var r = await api('/api/ui/background');
      applyBg(r.background || null);
    } catch(e){ /* ignore */ }
  }

  async function boot(){
    // 先确认令牌, 未授权就停在登录页
    try {
      var st = await (await fetch('/api/auth/status')).json();
      if (!st || !st.data || !st.data.authed) {
        showGate(/auth=fail/.test(location.search) ? '链接里的令牌无效，请手动输入' : '');
        return;
      }
    } catch(e){
      showGate('无法连接服务，请确认已启动');
      return;
    }
    hideGate();
    renderNav(); updateTitle();
    loadBackground();
    try {
      var d = await api('/api/watches');
      state.watches = d.watches || [];
      if (state.watches.length) state.id = state.watches[0].watchId;
      renderStrip();
      if (!state.watches.length && ['home', 'announcements', 'account', 'bind', 'chat', 'more', 'me', 'logs'].indexOf(state.tab) < 0) {
        state.tab = 'me';
      }
      var acc = await tryApi('/api/account');
      var an = $('#accountName');
      if (an && acc && acc.userName) an.textContent = acc.userName;
      renderNav(); updateTitle(); load();
    } catch(e){
      // 未登录时 /api/watches 返回 000003(token invalid), 这是"还没登录"不是出错,
      // 直接甩一行报错会让人以为程序坏了 —— 落到「我的」页引导登录
      if (/000003|token is invalid/i.test(String((e && e.message) || e))) {
        state.tab = 'me';
        state.watches = [];
        state.id = null;
        renderStrip(); renderNav(); updateTitle();
        await load();
        toast('请先登录家长端账号');
      } else {
        $('#content').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
      }
    }
  }

  // ===== 主题: 跟随系统 / 浅色 / 深色 =====
  // 真正的深浅色判断在 <head> 的内联脚本里先做一次(防首屏闪白), 这里只负责切换与持久化
  var THEME_KEY = 'jz_theme';
  var THEME_ORDER = ['auto', 'light', 'dark'];
  var THEME_LABEL = { auto: '跟随系统', light: '浅色', dark: '深色' };
  var THEME_ICON = {
    auto: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>',
    light: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>'
  };

  function themeChoice(){
    try {
      var v = localStorage.getItem(THEME_KEY);
      if (v === 'light' || v === 'dark') return v;
    } catch (e) { /* 隐私模式下 localStorage 可能不可用 */ }
    return 'auto';
  }
  function systemDark(){
    try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
    catch (e) { return false; }
  }
  // 顶栏一个、登录遮罩上一个(遮罩会盖住顶栏)
  function themeBtns(){
    var list = [];
    var a = $('#themeBtn'); if (a) list.push(a);
    var b = $('#themeBtnGate'); if (b) list.push(b);
    return list;
  }
  function paintThemeBtn(choice){
    var cur = THEME_ORDER.indexOf(choice) >= 0 ? choice : themeChoice();
    themeBtns().forEach(function(b){
      b.innerHTML = THEME_ICON[cur] || THEME_ICON.auto;
      b.setAttribute('title', '主题：' + THEME_LABEL[cur] + '（点击切换）');
      b.setAttribute('aria-label', '主题：' + THEME_LABEL[cur] + '，点击切换');
      b.setAttribute('data-choice', cur);
    });
  }
  function applyTheme(choice, opts){
    var c = THEME_ORDER.indexOf(choice) >= 0 ? choice : 'auto';
    // auto 在这里就解析成具体的 light/dark, CSS 只认这两个值
    var dark = c === 'dark' || (c === 'auto' && systemDark());
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    try { localStorage.setItem(THEME_KEY, c); } catch (e) { /* ignore */ }
    paintThemeBtn(c);
    if (!(opts && opts.silent)) toast('主题：' + THEME_LABEL[c]);
  }

  function cycleTheme(){
    var next = THEME_ORDER[(THEME_ORDER.indexOf(themeChoice()) + 1) % THEME_ORDER.length];
    applyTheme(next);
  }
  themeBtns().forEach(function(b){ b.onclick = cycleTheme; });
  // 选了「跟随系统」时, 系统切深浅色要跟着变
  try {
    var themeMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    if (themeMq) {
      var onThemeMq = function(){ if (themeChoice() === 'auto') applyTheme('auto', { silent: true }); };
      if (themeMq.addEventListener) themeMq.addEventListener('change', onThemeMq);
      else if (themeMq.addListener) themeMq.addListener(onThemeMq);
    }
  } catch (e) { /* ignore */ }
  paintThemeBtn(themeChoice());

  boot();
})();
</script>
